ción de salud de almacenamiento. |\n| Benchmark | Prueba de rendimiento. |\n| Diagnóstico | Prueba para detectar fallos. |\n| PXE | Arranque por red. |\n| WORM | Escribir una vez y leer muchas. |\n| Air gap | Aislamiento de una copia. |\n| 3-2-1 | Tres copias, dos soportes y una fuera del sitio. |\n| Ransomware | Malware que secuestra datos o sistemas. |\n\n---\n\n## 6. Preguntas de repaso\n\nIntenta responder antes de desplegar la solución.\n\n<details>\n<summary>01. ¿Qué contiene una imagen de sistema?<\/summary>\n\nSistema operativo, programas, configuración y datos incluidos.\n\n<\/details>\n\n<details>\n<summary>02. ¿Qué diferencia imagen y copia de archivos?<\/summary>\n\nLa imagen captura el entorno de un disco o partición, no solo archivos elegidos.\n\n<\/details>\n\n<details>\n<summary>03. ¿Qué es una imagen base?<\/summary>\n\nUn sistema configurado listo para desplegar.\n\n<\/details>\n\n<details>\n<summary>04. ¿Qué diferencia copia sector a sector e inteligente?<\/summary>\n\nLa primera copia todos los sectores; la inteligente solo los usados si es compatible.\n\n<\/details>\n\n<details>\n<summary>05. ¿Qué es particionar?<\/summary>\n\nDividir un disco lógicamente en secciones.\n\n<\/details>\n\n<details>\n<summary>06. ¿Cuántas particiones primarias admite MBR?<\/summary>\n\nCuatro.\n\n<\/details>\n\n<details>\n<summary>07. ¿Qué esquema se asocia habitualmente a UEFI?<\/summary>\n\nGPT.\n\n<\/details>\n\n<details>\n<summary>08. ¿Separar datos en otra partición sustituye un backup?<\/summary>\n\nNo; ambas particiones pueden perderse con el disco.\n\n<\/details>\n\n<details>\n<summary>09. ¿Qué es Clonezilla?<\/summary>\n\nHerramienta libre de imágenes, restauración y clonación.\n\n<\/details>\n\n<details>\n<summary>10. ¿Qué debes comprobar antes de restaurar?<\/summary>\n\nLa imagen, el disco de destino correcto y la copia independiente.\n\n<\/details>\n\n<details>\n<summary>11. ¿Qué significa P2P?<\/summary>\n\nFísico a físico.\n\n<\/details>\n\n<details>\n<summary>12. ¿Qué significa P2V?<\/summary>\n\nFísico a virtual.\n\n<\/details>\n\n<details>\n<summary>13. ¿Qué significa V2P?<\/summary>\n\nVirtual a físico.\n\n<\/details>\n\n<details>\n<summary>14. ¿Qué significa V2V?<\/summary>\n\nVirtual a virtual.\n\n<\/details>\n\n<details>\n<summary>15. ¿Qué debe verificarse antes de retirar un servidor físico migrado?<\/summary>\n\nArranque, datos y servicios de la VM.\n\n<\/details>\n\n<details>\n<summary>16. ¿Qué diferencia mantenimiento preventivo y correctivo?<\/summary>\n\nEl preventivo se anticipa a fallos; el correctivo repara averías.\n\n<\/details>\n\n<details>\n<summary>17. ¿Qué significa SMART?<\/summary>\n\nSelf-Monitoring, Analysis and Reporting Technology.\n\n<\/details>\n\n<details>\n<summary>18. ¿Qué parámetros puede vigilar SMART?<\/summary>\n\nSectores reasignados, errores, temperatura, horas y desgaste.\n\n<\/details>\n\n<details>\n<summary>19. ¿Qué hacer ante una alerta SMART?<\/summary>\n\nProteger datos y valorar sustituir la unidad.\n\n<\/details>\n\n<details>\n<summary>20. ¿SMART predice todos los fallos?<\/summary>\n\nNo.\n\n<\/details>\n\n<details>\n<summary>21. ¿Qué diferencia diagnóstico y benchmarking?<\/summary>\n\nDiagnóstico detecta fallos; benchmarking mide rendimiento.\n\n<\/details>\n\n<details>\n<summary>22. ¿Qué mide CrystalDiskMark?<\/summary>\n\nRendimiento del almacenamiento.\n\n<\/details>\n\n<details>\n<summary>23. ¿Qué mide Cinebench?<\/summary>\n\nRendimiento de CPU en las pruebas correspondientes.\n\n<\/details>\n\n<details>\n<summary>24. ¿Qué herramienta se usa para probar memoria?<\/summary>\n\nMemTest.\n\n<\/details>\n\n<details>\n<summary>25. ¿Qué es lo primero ante una pérdida de datos sin copia?<\/summary>\n\nDetener escrituras en el soporte afectado.\n\n<\/details>\n\n<details>\n<summary>26. ¿Por qué trabajar sobre un clon?<\/summary>\n\nPara no modificar el original y evitar empeorar la pérdida.\n\n<\/details>\n\n<details>\n<summary>27. ¿Qué hace TRIM a la recuperación de borrados?<\/summary>\n\nReduce drásticamente las posibilidades de recuperación.\n\n<\/details>\n\n<details>\n<summary>28. ¿Qué es PXE?<\/summary>\n\nArranque por red para cargar un entorno o desplegar sistemas.\n\n<\/details>\n\n<details>\n<summary>29. ¿Qué es WORM?<\/summary>\n\nEscritura única y lectura múltiple; base de copias inmutables.\n\n<\/details>\n\n<details>\n<summary>30. ¿Qué establece 3-2-1?<\/summary>\n\nTres copias, dos soportes y una fuera del sitio.\n\n<\/details>\n\n<details>\n<summary>31. ¿Qué es air gap?<\/summary>\n\nAislar una copia de la red o desconectarla.\n\n<\/details>\n\n<details>\n<summary>32. ¿Cuánto tarda idealmente copiar 100 GB a 100 MB/s?<\/summary>\n\n1.000 segundos, 16 min 40 s, con unidades decimales.\n\n<\/details>\n\n---\n\n## 7. Práctica\n\n- [ ] Planificar particiones MBR/GPT en un entorno virtual de prueba.\n- [ ] Crear y verificar una imagen con Clonezilla; documentarla y probar restauración en destino desechable.\n- [ ] Describir una migración P2V y sus comprobaciones.\n- [ ] Consultar SMART sin realizar operaciones destructivas.\n- [ ] Comparar benchmarks en las mismas condiciones.\n- [ ] Diseñar una política 3-2-1 con copia aislada/inmutable y prueba de restauración.\n\n**Entregable:** evidencia de imagen, análisis SMART y resultados de benchmark comparados.\n\n---\n\n## Resumen final\n\nLas imágenes permiten recuperar y desplegar sistemas. MBR y GPT organizan particiones. P2P, P2V, V2P y V2V trasladan sistemas entre entornos. SMART y mantenimiento preventivo permiten anticipar problemas; los benchmarks comparan rendimiento. Ante pérdida de datos hay que evitar escrituras y trabajar sobre una copia. PXE, plantillas cloud, inmutabilidad y 3-2-1 mejoran la protección y el despliegue.\n\n---\n\nFuente: Fundamentos de Hardware, Unidad 9. Prometeo - thePower. Apuntes personales. Los ejemplos y matices identificados como complementarios son material de apoyo.\n\n<div align=\"center\">\n\n`UNIDAD 09 | FUNDAMENTOS DE HARDWARE`\n\n[Volver al temario](../README.md)\n\n<\/div>\n", "questions": [["¿Qué contiene una imagen de sistema?", "Sistema operativo, programas, configuración y datos incluidos."], ["¿Qué diferencia imagen y copia de archivos?", "La imagen captura el entorno de un disco o partición, no solo archivos elegidos."], ["¿Qué es una imagen base?", "Un sistema configurado listo para desplegar."], ["¿Qué diferencia copia sector a sector e inteligente?", "La primera copia todos los sectores; la inteligente solo los usados si es compatible."], ["¿Qué es particionar?", "Dividir un disco lógicamente en secciones."], ["¿Cuántas particiones primarias admite MBR?", "Cuatro."], ["¿Qué esquema se asocia habitualmente a UEFI?", "GPT."], ["¿Separar datos en otra partición sustituye un backup?", "No; ambas particiones pueden perderse con el disco."], ["¿Qué es Clonezilla?", "Herramienta libre de imágenes, restauración y clonación."], ["¿Qué debes comprobar antes de restaurar?", "La imagen, el disco de destino correcto y la copia independiente."], ["¿Qué significa P2P?", "Físico a físico."], ["¿Qué significa P2V?", "Físico a virtual."], ["¿Qué significa V2P?", "Virtual a físico."], ["¿Qué significa V2V?", "Virtual a virtual."], ["¿Qué debe verificarse antes de retirar un servidor físico migrado?", "Arranque, datos y servicios de la VM."], ["¿Qué diferencia mantenimiento preventivo y correctivo?", "El preventivo se anticipa a fallos; el correctivo repara averías."], ["¿Qué significa SMART?", "Self-Monitoring, Analysis and Reporting Technology."], ["¿Qué parámetros puede vigilar SMART?", "Sectores reasignados, errores, temperatura, horas y desgaste."], ["¿Qué hacer ante una alerta SMART?", "Proteger datos y valorar sustituir la unidad."], ["¿SMART predice todos los fallos?", "No."], ["¿Qué diferencia diagnóstico y benchmarking?", "Diagnóstico detecta fallos; benchmarking mide rendimiento."], ["¿Qué mide CrystalDiskMark?", "Rendimiento del almacenamiento."], ["¿Qué mide Cinebench?", "Rendimiento de CPU en las pruebas correspondientes."], ["¿Qué herramienta se usa para probar memoria?", "MemTest."], ["¿Qué es lo primero ante una pérdida de datos sin copia?", "Detener escrituras en el soporte afectado."], ["¿Por qué trabajar sobre un clon?", "Para no modificar el original y evitar empeorar la pérdida."], ["¿Qué hace TRIM a la recuperación de borrados?", "Reduce drásticamente las posibilidades de recuperación."], ["¿Qué es PXE?", "Arranque por red para cargar un entorno o desplegar sistemas."], ["¿Qué es WORM?", "Escritura única y lectura múltiple; base de copias inmutables."], ["¿Qué establece 3-2-1?", "Tres copias, dos soportes y una fuera del sitio."], ["¿Qué es air gap?", "Aislar una copia de la red o desconectarla."], ["¿Cuánto tarda idealmente copiar 100 GB a 100 MB/s?", "1.000 segundos, 16 min 40 s, con unidades decimales."]], "summary": "Las imágenes permiten recuperar y desplegar sistemas. MBR y GPT organizan particiones. P2P, P2V, V2P y V2V trasladan sistemas entre entornos. SMART y mantenimiento preventivo permiten anticipar problemas; los benchmarks comparan rendimiento. Ante pérdida de datos hay que evitar escrituras y trabajar sobre una copia. PXE, plantillas cloud, inmutabilidad y 3-2-1 mejoran la protección y el despliegue."}, "1": {"title": "Sistemas informáticos: estructura funcional", "markdown": "# Sistemas informáticos: estructura funcional\n\n> Vista rápida integrada. En GitHub Pages se carga el README completo de esta unidad.\n\n## Arquitectura y CPU\nVon Neumann comparte memoria para datos e instrucciones; Harvard las separa. La CPU integra unidad de control (interpreta y coordina) y ALU (operaciones aritméticas y lógicas). El ciclo de instrucción es Fetch → Decode → Execute. Los GHz miden ciclos de reloj por segundo, no instrucciones.\n## Jerarquía y buses\nRegistros → caché L1/L2/L3 → RAM → SSD/HDD. Cerca de la CPU: más velocidad y coste por bit, menor capacidad. La localidad explica la utilidad de la caché. Bus de datos: información; direcciones: ubicación; control: señales. El componente más lento puede limitar el conjunto.\n## Software y seguridad\nSoftware de sistema, programación y aplicación. Licencias propietarias, libres, freeware y shareware. Descarga oficial, verifica hash y firma, revisa instalador, actualiza y usa privilegios mínimos. Compresión ZIP, 7z y TAR.GZ; antivirus detecta malware, cortafuegos filtra tráfico. Aplicaciones portables evitan instalación convencional, pero complican inventario. x86, ARM y RISC-V; CPU, GPU y NPU. SaaS, máquinas virtuales y contenedores.", "questions": [["¿Qué caracteriza Von Neumann?", "Memoria común para datos e instrucciones."], ["¿Y Harvard?", "Memorias separadas."], ["¿Qué hace la UC?", "Interpreta y coordina instrucciones."], ["¿Qué hace la ALU?", "Operaciones aritméticas y lógicas."], ["¿Cuáles son las fases del ciclo?", "Fetch, Decode y Execute."], ["¿Qué mide GHz?", "Miles de millones de ciclos por segundo."], ["¿Cómo se ordena la memoria?", "Registros, caché, RAM, almacenamiento."], ["¿Qué es localidad?", "Reutilización de datos o acceso a posiciones próximas."], ["¿Qué buses existen?", "Datos, direcciones y control."], ["¿Qué significa RAM volátil?", "Pierde contenido sin alimentación."], ["¿Qué diferencia software libre y freeware?", "Libertades de licencia frente a gratuidad de uso."], ["¿Qué verifica un hash?", "Integridad frente a referencia fiable."], ["¿Qué diferencia antivirus y firewall?", "Detectar malware frente a filtrar tráfico."], ["¿Qué es SaaS?", "Software como servicio."], ["¿Qué es virtualización?", "Ejecutar sistemas invitados sobre hardware compartido."]], "summary": "## Arquitectura y CPU\nVon Neumann comparte memoria para datos e instrucciones; Harvard las separa. La CPU integra unidad de control (interpreta y coordina) y ALU (operaciones aritméticas y lógicas). El ciclo de instrucción es Fetch → Decode → Execute. Los GHz miden ciclos de reloj por segundo, no instrucciones.\n## Jerarquía y buses\nRegistros → caché L1/L2/L3 → RAM → SSD/HDD. Cerca de la CPU: más velocidad y coste por bit, menor capacidad. La localidad explica la utilidad de la caché. Bus de datos: información; direcciones: ubicación; control: señales. El componente más lento puede limitar el conjunto.\n## Software y seguridad\nSoftware de sistema, programación y aplicación. Licencias propietarias, libres, freeware y shareware. Descarga oficial, verifica hash y firma, revisa instalador, actualiza y usa privilegios mínimos. Compresión ZIP, 7z y TAR.GZ; antivirus detecta malware, cortafuegos filtra tráfico. Aplicaciones portables evitan instalación convencional, pero complican inventario. x86, ARM y RISC-V; CPU, GPU y NPU. SaaS, máquinas virtuales y contenedores."}, "2": {"title": "Estructura física: la placa base", "markdown": "# Estructura física: la placa base\n\n> Vista rápida integrada. En GitHub Pages se carga el README completo de esta unidad.\n\n## Placa, socket y chipset\nLa placa base interconecta componentes. ATX, micro-ATX, Mini-ITX y formatos de servidor determinan dimensiones y expansión. Socket: zócalo de CPU; chipset: comunicaciones y prestaciones. Verifica lista de CPU, firmware y QVL de memoria.\n## Conectores, firmware y rendimiento\nPCIe x1/x4/x8/x16; DIMM para RAM, SATA y M.2 para almacenamiento. M.2 es formato, NVMe protocolo. BIOS clásica y UEFI moderna inicializan el hardware mediante POST y preparan arranque; GPT y Secure Boot son funciones asociadas al arranque UEFI. Overclocking aumenta frecuencia y puede aumentar calor, consumo e inestabilidad.\n## Memoria y plataformas\nDDR3/DDR4/DDR5 no son intercambiables. DIMM y SO-DIMM. Dual channel aumenta ancho de banda; instalar módulos en ranuras indicadas por manual. PCIe 5.0 y DDR5 amplían prestaciones. Servidores: ECC, redundancia, gestión BMC/IPMI; edge: procesar cerca del dato.", "questions": [["¿Qué hace la placa base?", "Conecta y comunica componentes."], ["¿Qué es el factor de forma?", "Estándar de dimensiones y anclajes."], ["¿Qué es socket?", "Zócalo del procesador."], ["¿Qué es chipset?", "Gestiona parte de las comunicaciones y funciones."], ["¿Qué es PCIe?", "Interfaz de alta velocidad."], ["¿M.2 equivale a NVMe?", "No, M.2 es formato y NVMe protocolo."], ["¿Qué es POST?", "Autocomprobación de encendido."], ["¿Qué es UEFI?", "Firmware moderno de arranque."], ["¿Qué hace Secure Boot?", "Verifica confianza del software de arranque."], ["¿Qué riesgo tiene overclocking?", "Calor, consumo e inestabilidad."], ["¿Se mezclan DDR4 y DDR5?", "No."], ["¿DIMM y SO-DIMM?", "Formato de sobremesa y formato compacto."], ["¿Qué hace dual channel?", "Aumenta el ancho de banda."], ["¿Qué hace ECC?", "Detecta y corrige ciertos errores."], ["¿Qué es edge?", "Procesar cerca del dato."]], "summary": "## Placa, socket y chipset\nLa placa base interconecta componentes. ATX, micro-ATX, Mini-ITX y formatos de servidor determinan dimensiones y expansión. Socket: zócalo de CPU; chipset: comunicaciones y prestaciones. Verifica lista de CPU, firmware y QVL de memoria.\n## Conectores, firmware y rendimiento\nPCIe x1/x4/x8/x16; DIMM para RAM, SATA y M.2 para almacenamiento. M.2 es formato, NVMe protocolo. BIOS clásica y UEFI moderna inicializan el hardware mediante POST y preparan arranque; GPT y Secure Boot son funciones asociadas al arranque UEFI. Overclocking aumenta frecuencia y puede aumentar calor, consumo e inestabilidad.\n## Memoria y plataformas\nDDR3/DDR4/DDR5 no son intercambiables. DIMM y SO-DIMM. Dual channel aumenta ancho de banda; instalar módulos en ranuras indicadas por manual. PCIe 5.0 y DDR5 amplían prestaciones. Servidores: ECC, redundancia, gestión BMC/IPMI; edge: procesar cerca del dato."}, "3": {"title": "Soporte, conexionado, cajas, alimentación y BIOS", "markdown": "# Soporte, conexionado, cajas, alimentación y BIOS\n\n> Vista rápida integrada. En GitHub Pages se carga el README completo de esta unidad.\n\n## Montaje seguro\nESD puede dañar chips sin percibirse. Desconectar corriente, pulsera y alfombrilla antiestática adecuadas, guardar en bolsas, no forzar componentes. Orden: CPU, pasta y disipador, RAM, placa sobre separadores, PSU, discos/tarjetas, cableado, POST/UEFI. ATX 24 pines alimenta placa y EPS CPU el procesador.\n## Cajas, PSU y SAI\nTorre, SFF y rack. Aire frío delante, caliente detrás/arriba. PSU convierte CA en CC. Sumar consumos y añadir margen orientativo de 20–30 %. 80 PLUS mide eficiencia, no calidad total. SAI mantiene temporalmente energía; comprobar límites VA y W y autonomía del fabricante.\n## Refrigeración y sostenibilidad\nTDP orienta el dimensionamiento térmico, no es necesariamente consumo máximo. Throttling reduce rendimiento para proteger temperatura. Refrigeración pasiva (disipador), activa por aire o líquida (AIO/custom). Pasta térmica mejora contacto. Eficiencia, refrigeración por inmersión y RAEE: reparar/reutilizar y reciclar mediante gestores autorizados.", "questions": [["¿Qué significa ESD?", "Descarga electrostática."], ["¿Cómo prevenir ESD?", "Pulsera y alfombrilla adecuadas, manipulación segura."], ["¿Debe estar conectado el equipo durante el montaje?", "No."], ["¿Qué se monta antes de fijar placa a caja?", "CPU, refrigeración y RAM cuando sea posible."], ["¿Qué hacen los separadores?", "Evitan contacto de la placa con chasis."], ["¿Qué alimenta ATX 24 pines?", "Placa base."], ["¿Qué alimenta EPS?", "CPU."], ["¿Qué es airflow?", "Flujo de aire."], ["¿Qué convierte la PSU?", "CA de red en CC."], ["¿Qué mide 80 PLUS?", "Eficiencia energética."], ["¿Qué margen propone el temario?", "20–30 % orientativo."], ["¿Qué es SAI?", "Alimentación ininterrumpida temporal con baterías."], ["¿Qué es TDP?", "Potencia de diseño térmico."], ["¿Qué es throttling?", "Reducción de rendimiento por protección térmica."], ["¿Qué son RAEE?", "Residuos de aparatos eléctricos y electrónicos."]], "summary": "## Montaje seguro\nESD puede dañar chips sin percibirse. Desconectar corriente, pulsera y alfombrilla antiestática adecuadas, guardar en bolsas, no forzar componentes. Orden: CPU, pasta y disipador, RAM, placa sobre separadores, PSU, discos/tarjetas, cableado, POST/UEFI. ATX 24 pines alimenta placa y EPS CPU el procesador.\n## Cajas, PSU y SAI\nTorre, SFF y rack. Aire frío delante, caliente detrás/arriba. PSU convierte CA en CC. Sumar consumos y añadir margen orientativo de 20–30 %. 80 PLUS mide eficiencia, no calidad total. SAI mantiene temporalmente energía; comprobar límites VA y W y autonomía del fabricante.\n## Refrigeración y sostenibilidad\nTDP orienta el dimensionamiento térmico, no es necesariamente consumo máximo. Throttling reduce rendimiento para proteger temperatura. Refrigeración pasiva (disipador), activa por aire o líquida (AIO/custom). Pasta térmica mejora contacto. Eficiencia, refrigeración por inmersión y RAEE: reparar/reutilizar y reciclar mediante gestores autorizados."}, "4": {"title": "Microprocesadores y memoria", "markdown": "# Microprocesadores y memoria\n\n> Vista rápida integrada. En GitHub Pages se carga el README completo de esta unidad.\n\n## Procesador\nIntel 4004 (1971), evolución hacia multinúcleo. Frecuencia, núcleos, hilos, caché, TDP y arquitectura determinan rendimiento. SMT/Hyper-Threading permite varios hilos de hardware por núcleo. CISC (x86), RISC (ARM y RISC-V); compatibilidad software depende de arquitectura.\n## Ley de Moore y servidores\nEl número de transistores se duplicaba aproximadamente cada dos años según formulación habitual; no equivale a velocidad. Límites físicos y económicos favorecen paralelismo y especialización. Consumo: rendimiento/precio; servidor: escalabilidad, núcleos, ECC, líneas PCIe y fiabilidad (Xeon, EPYC).\n## RAM\nDRAM almacena bits en celdas con condensadores y transistores; requiere refresco, es volátil y de acceso aleatorio. Capacidad primero, luego MT/s, CL y canales. Latencia CAS (ns) = CL × 2000 / MT/s. Ancho de banda (MB/s) = MT/s × 8 × canales de 64 bits. ECC protege frente a determinados errores; necesita plataforma compatible. CPU general, GPU paralelismo, NPU IA; HBM apilada de gran ancho de banda.", "questions": [["¿Qué es un microprocesador?", "Chip que integra la CPU."], ["¿Qué fue Intel 4004?", "Primer microprocesador comercial, 1971."], ["¿Qué mide GHz?", "Ciclos de reloj por segundo."], ["¿Qué diferencia núcleo e hilo?", "Unidad física y flujo de ejecución."], ["¿Qué es caché?", "Memoria rápida para datos e instrucciones."], ["¿Qué significa CISC?", "Complex Instruction Set Computer."], ["¿Qué significa RISC?", "Reduced Instruction Set Computer."], ["¿Qué establece Moore?", "Duplicación aproximada de transistores cada dos años."], ["¿Qué prioriza CPU de servidor?", "Fiabilidad, escalabilidad, memoria y paralelismo."], ["¿Por qué DRAM necesita refresco?", "Los condensadores pierden carga."], ["¿Qué diferencia MHz y MT/s?", "Ciclos y transferencias por segundo."], ["¿Qué mide CL?", "Latencia CAS en ciclos."], ["¿Qué ancho de banda tiene DDR4-3200 dual channel?", "51,2 GB/s teóricos con canales de 64 bits."], ["¿Qué latencia tiene DDR4-3200 CL16?", "10 ns CAS."], ["¿Qué hace ECC?", "Detecta y corrige determinados errores."], ["¿Qué es HBM?", "Memoria apilada de alto ancho de banda."]], "summary": "## Procesador\nIntel 4004 (1971), evolución hacia multinúcleo. Frecuencia, núcleos, hilos, caché, TDP y arquitectura determinan rendimiento. SMT/Hyper-Threading permite varios hilos de hardware por núcleo. CISC (x86), RISC (ARM y RISC-V); compatibilidad software depende de arquitectura.\n## Ley de Moore y servidores\nEl número de transistores se duplicaba aproximadamente cada dos años según formulación habitual; no equivale a velocidad. Límites físicos y económicos favorecen paralelismo y especialización. Consumo: rendimiento/precio; servidor: escalabilidad, núcleos, ECC, líneas PCIe y fiabilidad (Xeon, EPYC).\n## RAM\nDRAM almacena bits en celdas con condensadores y transistores; requiere refresco, es volátil y de acceso aleatorio. Capacidad primero, luego MT/s, CL y canales. Latencia CAS (ns) = CL × 2000 / MT/s. Ancho de banda (MB/s) = MT/s × 8 × canales de 64 bits. ECC protege frente a determinados errores; necesita plataforma compatible. CPU general, GPU paralelismo, NPU IA; HBM apilada de gran ancho de banda."}};const app=document.querySelector('#app');const saved=Object.create(null);const fallback=new Set([1,2,3,4]);let current='home',activeUnit=1,quizState=null;const local=(()=>{try{return JSON.parse(localStorage.getItem('hardwareLabProgress')||'{}')}catch{return {}}})();const store=()=>{try{localStorage.setItem('hardwareLabProgress',JSON.stringify(local))}catch{}};const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pad=n=>String(n).padStart(2,'0');const fmt=(n,d=2)=>Number(n).toLocaleString('es-ES',{maximumFractionDigits:d});const norm=x=>String(x).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();const all=()=>Object.keys(DATA).map(Number).sort((a,b)=>a-b);const doc=n=>saved[n]||DATA[n];const isFull=n=>!!saved[n]||!fallback.has(n);const done=()=>all().filter(n=>local['unit'+n]).length;const questionCount=()=>all().reduce((s,n)=>s+doc(n).questions.length,0);const slug=s=>s.toLowerCase().replace(/[^\p{L}\p{N}_\- ]/gu,'').replace(/ /g,'-');
function extractQuestions(md){return [...md.matchAll(/<details\b[^>]*>\s*<summary>([\s\S]*?)<\/summary>([\s\S]*?)<\/details>/gi)].map(m=>[m[1].replace(/^\s*\d+\.\s*/, '').trim(),m[2].trim()]);}
async function loadRepo(){if(!['http:','https:'].includes(location.protocol))return;await Promise.all(all().map(async n=>{try{const r=await fetch(`./Tema-${pad(n)}/README.md`,{cache:'no-cache'});if(!r.ok)return;const md=await r.text();if(!/^\s*(?:<div|#|\[)/i.test(md)||/^\s*<!doctype/i.test(md))return;const q=extractQuestions(md);saved[n]={...DATA[n],markdown:md,questions:q.length?q:DATA[n].questions};}catch{}}));if(current==='home'||current==='notes'||current==='unit'||(current==='quiz'&&!quizState))render();else if(current==='search'){const q=document.querySelector('#query')?.value||'';if(q)searchNotes(q);}}
function go(page,n){current=page;if(n)activeUnit=Number(n);if(page==='quiz')quizState=null;location.hash=page==='unit'?`unit-${activeUnit}`:page;render();window.scrollTo({top:0,behavior:'instant'});}
function route(){const h=location.hash.slice(1);if(/^unit-[1-9]$/.test(h)){activeUnit=+h.slice(5);current='unit'}else if(['home','notes','tools','lab','quiz','search'].includes(h))current=h;else return;render()}
window.addEventListener('hashchange',()=>{if(location.hash.slice(1)!==(current==='unit'?`unit-${activeUnit}`:current)&&!location.hash.includes('section-'))route()});
function title(k,h,s){return `<div class="hero"><div class="eyebrow">${esc(k)}</div><h1>${esc(h)}</h1><p class="sub">${esc(s)}</p></div>`}
function unitTiles(){return `<div class="grid">${all().map(n=>`<button class="tile" onclick="go('unit',${n})"><span class="num">UNIDAD ${pad(n)} ${local['unit'+n]?'· ✓':''}</span><strong>${esc(DATA[n].title)}</strong><span class="muted">${doc(n).questions.length} preguntas · ${isFull(n)?'Apuntes completos':'Vista rápida local'}</span></button>`).join('')}</div>`}
function home(){app.innerHTML=title('ASIR / CUADERNO DIGITAL','Tu laboratorio de hardware','Nueve unidades, conceptos técnicos y herramientas para practicar a tu ritmo.')+`<div class="stats"><div class="panel"><span class="metric">09</span><span class="muted">Unidades</span></div><div class="panel"><span class="metric">${questionCount()}</span><span class="muted">Preguntas disponibles</span></div><div class="panel"><span class="metric">${done()}/9</span><span class="muted">Unidades marcadas</span><div class="bar"><span style="width:${done()/9*100}%"></span></div></div></div><div class="controls"><button class="primary" onclick="go('notes')">Abrir apuntes</button><button onclick="go('tools')">Calculadoras</button><button onclick="go('lab')">Simuladores</button><button onclick="go('quiz')">Practicar preguntas</button></div><h2>Temario completo</h2>${unitTiles()}<h2>Estudio y herramientas</h2><div class="grid"><button class="tile" onclick="go('tools')"><span class="num">01 / CALC</span><strong>12 calculadoras técnicas</strong><span class="muted">PSU, RAM, RAID, PUE, PCIe, SAI y más.</span></button><button class="tile" onclick="go('lab')"><span class="num">LAB / SIM</span><strong>10 simuladores interactivos</strong><span class="muted">CPU, memorias, montaje, RAID, rack, nube y respaldo.</span></button><button class="tile" onclick="go('quiz')"><span class="num">02 / REPASO</span><strong>Preguntas y tarjetas</strong><span class="muted">Selecciona unidades y comprueba tus respuestas.</span></button><button class="tile" onclick="go('search')"><span class="num">03 / FIND</span><strong>Buscador de conceptos</strong><span class="muted">Encuentra términos en los apuntes.</span></button></div>${all().some(n=>!isFull(n))?'<p class="notice">Vista local: las unidades 1–4 incluyen un repaso abreviado. Al publicar el archivo junto a tus README originales se cargarán los apuntes completos y sus preguntas. Las unidades 5–9 ya están integradas.</p>':''}`}
function renderNotes(){app.innerHTML=title('TEMARIO','Unidades de aprendizaje','Selecciona una unidad. Puedes marcarla como dominada y volver cuando quieras.')+unitTiles()}
function markdownHtml(md){ // render trusted repository Markdown; strip potentially active raw HTML, keeping details and basic formatting
 let clean=md.replace(/<img\b[^>]*>/gi,'').replace(/<\/?div\b[^>]*>/gi,'').replace(/<script\b[\s\S]*?<\/script>/gi,'').replace(/<iframe\b[\s\S]*?<\/iframe>/gi,'').replace(/<\/?(?:object|embed|style|form|input|button)\b[^>]*>/gi,'');
 let html=marked.parse(clean,{gfm:true,headerIds:true,mangle:false});const tpl=document.createElement('template');tpl.innerHTML=html;for(const el of tpl.content.querySelectorAll('*')){for(const a of [...el.attributes]){if(/^on/i.test(a.name)||a.name==='srcdoc'||/^(?:javascript|data):/i.test(a.value))el.removeAttribute(a.name)}if(['SCRIPT','IFRAME','OBJECT','EMBED','STYLE','FORM','META','LINK','BASE'].includes(el.tagName))el.remove();}return tpl.innerHTML;}
let mermaidPromise;async function diagrams(){const nodes=[...app.querySelectorAll('code.language-mermaid')];if(!nodes.length)return;for(const code of nodes){const pre=code.parentElement;pre.dataset.diagram='true';}try{mermaidPromise ||= import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs').then(m=>{m.default.initialize({startOnLoad:false,theme:'dark',securityLevel:'strict',themeVariables:{primaryColor:'#ce1141',primaryTextColor:'#ffffff',primaryBorderColor:'#ff3658',lineColor:'#a7a7b1'}});return m.default});const m=await mermaidPromise;for(let i=0;i<nodes.length;i++){const code=nodes[i];if(!code.isConnected)continue;try{const {svg}=await m.render('hwdiag'+Date.now()+'_'+i,code.textContent);const d=document.createElement('div');d.className='mermaid';d.innerHTML=svg;code.parentElement.replaceWith(d)}catch{}}}catch{}}
function renderUnit(){const n=activeUnit,d=doc(n);app.innerHTML=`<div class="controls"><button onclick="go('notes')">← Temario</button><button onclick="copyNotes(${n})">Copiar Markdown</button><button onclick="downloadNotes(${n})">Descargar Markdown</button><button onclick="window.print()">Imprimir</button></div><div class="eyebrow">UNIDAD ${pad(n)}</div>${isFull(n)?'':'<div class="notice">Repaso rápido local: el README original completo se carga al publicar. También puedes importarlo aquí.</div>'}<div class="controls"><label><input type="checkbox" ${local['unit'+n]?'checked':''} onchange="local['unit'+${n}]=this.checked;store()"> Unidad dominada</label><label class="muted">Importar README local <input type="file" accept=".md,.txt" onchange="importNotes(${n},this)"></label></div><article class="read">${markdownHtml(d.markdown)}</article><div class="controls">${n>1?`<button onclick="go('unit',${n-1})">← Unidad ${pad(n-1)}</button>`:''}<button class="primary" onclick="go('quiz');document.getElementById('unitsQuiz').value='${n}'">Repasar unidad ${pad(n)}</button>${n<9?`<button onclick="go('unit',${n+1})">Unidad ${pad(n+1)} →</button>`:''}</div>`;for(const h of app.querySelectorAll('.read h1,.read h2,.read h3'))h.id='section-'+slug(h.textContent);for(const a of app.querySelectorAll('.read a')){const href=a.getAttribute('href')||'';if(href.startsWith('#')){a.onclick=e=>{e.preventDefault();const id='section-'+decodeURIComponent(href.slice(1));document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'})}}else if(href==='../README.md'||href==='../index.html'){a.onclick=e=>{e.preventDefault();go('notes')}}}diagrams();}
async function copyNotes(n){try{await navigator.clipboard.writeText(doc(n).markdown);alert('Markdown copiado.')}catch{const t=document.createElement('textarea');t.value=doc(n).markdown;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();if(!ok)alert('No se pudo copiar. Usa Descargar Markdown.');else alert('Markdown copiado.')}}
function downloadNotes(n){const a=document.createElement('a');const u=URL.createObjectURL(new Blob([doc(n).markdown],{type:'text/markdown;charset=utf-8'}));a.href=u;a.download=`Tema-${pad(n)}-README.md`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function importNotes(n,input){if(!input.files[0])return;const md=await input.files[0].text();const q=extractQuestions(md);saved[n]={...DATA[n],markdown:md,questions:q.length?q:DATA[n].questions};renderUnit()}
function searchPage(){app.innerHTML=title('FIND / GLOSARIO','Busca cualquier concepto','Busca dentro de las nueve unidades disponibles, no solo en los títulos.')+`<input class="search" id="query" placeholder="Ej. ECC, RAID, UEFI, caché, PUE…" oninput="searchNotes(this.value)" autofocus><div id="hits" class="panel" style="margin-top:15px"><p class="muted">Escribe al menos dos caracteres.</p></div>`}
function searchNotes(q){const hit=document.querySelector('#hits');q=q.trim();if(q.length<2){hit.innerHTML='<p class="muted">Escribe al menos dos caracteres.</p>';return}let results=[];const query=norm(q);for(const n of all()){let section=DATA[n].title;for(const line of doc(n).markdown.split('\n')){if(/^#{2,3}\s/.test(line))section=line.replace(/^#+\s/,'');if(line.length>8&&norm(line).includes(query)&&!/^<|^\[|^style/.test(line)){results.push({n,section,line:line.replace(/\|/g,' · ').slice(0,250)});if(results.length>=100)break}}}hit.innerHTML=results.length?`<p class="muted">${results.length}${results.length===100?'+':''} coincidencias</p>`+results.map(x=>`<div class="search-result" role="button" tabindex="0" data-unit="${x.n}" data-section="${esc(x.section)}"><strong>U${pad(x.n)} · ${esc(x.section)}</strong><br>${esc(x.line)}</div>`).join(''):'<p>No se han encontrado coincidencias.</p>';for(const el of hit.querySelectorAll('.search-result')){const jump=()=>{go('unit',+el.dataset.unit);setTimeout(()=>document.getElementById('section-'+slug(el.dataset.section))?.scrollIntoView({block:'start'}),100)};el.onclick=jump;el.onkeydown=e=>{if(e.key==='Enter')jump()}}}
function quizPage(){app.innerHTML=title('RECALL / APRENDIZAJE ACTIVO','Preguntas de repaso','Responde mentalmente, descubre la solución y valora si la sabías.')+`<div class="quiz panel"><div class="field"><label for="unitsQuiz">Unidades</label><select id="unitsQuiz"><option value="1-4">Unidades 1–4</option><option value="all">Todas las unidades</option>${all().map(n=>`<option value="${n}">Unidad ${pad(n)} · ${esc(DATA[n].title)}</option>`).join('')}</select></div><div class="field"><label for="modeQuiz">Modo</label><select id="modeQuiz"><option value="random">Aleatorio</option><option value="ordered">En orden</option><option value="missed">Falladas guardadas</option></select></div><button class="primary" onclick="startQuiz()">Empezar repaso</button><div id="quizArea"></div></div>`}
function startQuiz(){const sel=document.getElementById('unitsQuiz').value,mode=document.getElementById('modeQuiz').value;let ns=sel==='all'?all():sel==='1-4'?[1,2,3,4]:[+sel];let items=ns.flatMap(n=>doc(n).questions.map(([q,a])=>({n,q,a,id:`${n}:${q}`})));if(mode==='missed')items=items.filter(x=>local[x.id]==='missed');if(mode==='random')for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}quizState={items,i:0,correct:0,reveal:false,wrong:[]};quizCard()}
function quizCard(){const el=document.querySelector('#quizArea'),s=quizState;if(!s.items.length){el.innerHTML='<p class="notice">No hay preguntas en esta selección.</p>';return}if(s.i>=s.items.length){el.innerHTML=`<h2>Repaso completado</h2><span class="metric">${s.correct}/${s.items.length}</span><p>${fmt(s.correct/s.items.length*100,1)} % marcadas como conocidas.</p>${s.wrong.length?'<button onclick="retryQuiz()">Repasar las falladas</button>':''}`;return}const q=s.items[s.i];el.innerHTML=`<hr><p class="tag">UNIDAD ${pad(q.n)} · ${s.i+1}/${s.items.length}</p><div class="bar"><span style="width:${s.i/s.items.length*100}%"></span></div><p class="question">${esc(q.q)}</p>${s.reveal?`<div class="answer">${markdownHtml(q.a)}</div><div class="controls"><button onclick="rateQuiz(false)">No me la sabía</button><button class="primary" onclick="rateQuiz(true)">Sí, la sabía ✓</button></div>`:`<button class="primary" onclick="quizState.reveal=true;quizCard()">Mostrar respuesta</button>`}`}
function rateQuiz(ok){const s=quizState,q=s.items[s.i];local[q.id]=ok?'known':'missed';store();if(ok)s.correct++;else s.wrong.push(q);s.i++;s.reveal=false;quizCard()}
function retryQuiz(){quizState={items:quizState.wrong,i:0,correct:0,reveal:false,wrong:[]};quizCard()}
const calculators=[
{title:'Potencia de fuente (PSU)',unit:3,fields:[['cpu','CPU (W)',125],['gpu','GPU (W)',250],['rest','Resto (W)',75],['margin','Margen (%)',25]],formula:'P = (CPU + GPU + resto) × (1 + margen/100)',note:'Margen orientativo 20–30 %. Comprueba picos, conectores y recomendaciones del fabricante.',run:v=>{let p=v.cpu+v.gpu+v.rest,r=p*(1+v.margin/100),s=[300,350,400,450,500,550,600,650,750,850,1000,1200,1500,1600].find(n=>n>=r);return `Consumo: ${fmt(p)} W\nCon margen: ${fmt(r)} W\nFuente orientativa: ${s?s+' W':'consultar capacidad superior'}`}},
{title:'Eficiencia de la fuente',unit:3,fields:[['out','Potencia entregada (W)',450],['eff','Eficiencia (%)',90]],formula:'P entrada = P salida / eficiencia',note:'Eficiencia entre 0 y 100 %. No mide por sí sola la calidad de una PSU.',run:v=>v.eff>0&&v.eff<=100?`Red: ${fmt(v.out/(v.eff/100))} W\nPérdidas: ${fmt(v.out/(v.eff/100)-v.out)} W`:'Introduce una eficiencia mayor que 0 y hasta 100 %.'},
{title:'Autonomía teórica de SAI',unit:3,fields:[['volts','Tensión total batería (V)',12],['ah','Capacidad del conjunto (Ah)',9],['load','Carga (W)',100],['eff','Factor de energía aprovechable (%)',70]],formula:'min = V × Ah × factor / W × 60',note:'Estimación idealizada; factor ajustable, no medido. Consulta curva de autonomía real y límites W/VA.',run:v=>v.load>0&&v.eff>0&&v.eff<=100?`Energía nominal: ${fmt(v.volts*v.ah)} Wh\nIdeal: ${fmt(v.volts*v.ah/v.load*60)} min\nCon factor: ${fmt(v.volts*v.ah*v.eff/100/v.load*60)} min`:'Revisa carga y factor (1–100 %).'},
{title:'Memoria RAM',unit:4,fields:[['speed','Velocidad (MT/s)',3200],['cl','Latencia CAS (CL)',16],['ch','Canales de 64 bits',2,[1,2,4,8]]],formula:'CAS (ns) = CL × 2000 / MT/s · GB/s = MT/s × 8 × canales / 1000',note:'Ancho de banda teórico y latencia CAS, no rendimiento medido.',run:v=>v.speed>0?`Latencia CAS: ${fmt(v.cl*2000/v.speed)} ns\nAncho de banda: ${fmt(v.speed*8*v.ch/1000)} GB/s`:'La velocidad debe ser mayor que cero.'},
{title:'Ancho de banda PCIe',unit:5,fields:[['gen','Generación PCIe',4,[3,4,5]],['lanes','Líneas',16,[1,2,4,8,16]]],formula:'GB/s = GT/s × 128/130 × líneas / 8',note:'Techo de enlace por dirección (PCIe 3–5), antes de otras sobrecargas.',run:v=>{let x={3:8,4:16,5:32}[v.gen]*128/130*v.lanes/8;return `${fmt(x)} GB/s por dirección\n${fmt(x*1000)} MB/s`}},
{title:'Capacidad RAID',unit:6,fields:[['level','Nivel',5,[0,1,5,6,10]],['n','Número de discos iguales',4],['size','Capacidad por disco (TB)',4]],formula:'0: N×C · 1: C · 5: (N−1)×C · 6: (N−2)×C · 10: N×C/2',note:'Capacidad decimal teórica antes de formato/metadatos. RAID 1 se modela como pareja. RAID no es backup.',run:v=>{let n=v.n,l=v.level,c=v.size,min={0:2,1:2,5:3,6:4,10:4}[l];if(!Number.isInteger(n)||n<min||l===10&&n%2||l===1&&n!==2||c<=0)return 'Configuración no válida para este modelo RAID.';let r={0:n,1:1,5:n-1,6:n-2,10:n/2}[l]*c;return `Bruto: ${fmt(n*c)} TB\nÚtil: ${fmt(r)} TB\nTolerancia: ${l===10?'1 garantizado; más si son espejos distintos':{0:'0 discos',1:'1 disco',5:'1 disco',6:'2 discos'}[l]}`}},
{title:'Unidades de almacenamiento',unit:6,fields:[['size','Capacidad decimal (GB)',1000]],formula:'GiB = GB × 10⁹ / 2³⁰ · TiB = GB × 10⁹ / 2⁴⁰',note:'GB/TB son decimales; GiB/TiB son binarios. No incluye espacio de formato.',run:v=>`${fmt(v.size/1000,4)} TB\n${fmt(v.size*1e9/2**30)} GiB\n${fmt(v.size*1e9/2**40,4)} TiB`},
{title:'Tiempo de transferencia / respaldo',unit:9,fields:[['size','Tamaño (GB decimales)',100],['speed','Velocidad efectiva (MB/s)',100]],formula:'s = GB × 1000 / MB/s',note:'Tiempo ideal usando velocidad efectiva constante. Puede aumentar por verificación y otros costes.',run:v=>{if(v.speed<=0)return 'La velocidad debe ser mayor que cero.';let s=v.size*1000/v.speed;return `${fmt(s)} s\n${fmt(s/60)} min · ${fmt(s/3600)} h`}},
{title:'Ocupación del rack',unit:7,fields:[['capacity','Capacidad rack (U)',42],['servers','Número servidores',12],['u','U por servidor',2],['other','U del resto',6]],formula:'U ocupadas = servidores × U por servidor + resto',note:'Comprueba profundidad, peso, distribución eléctrica y refrigeración por separado.',run:v=>{if(![v.capacity,v.servers,v.u,v.other].every(Number.isInteger)||v.capacity<=0||v.u<=0)return 'Introduce unidades enteras válidas.';let u=v.servers*v.u+v.other;return `Ocupadas: ${u} U\n${u<=v.capacity?'Libres: '+(v.capacity-u)+' U':'Exceso: '+(u-v.capacity)+' U'}\nOcupación: ${fmt(u/v.capacity*100)} %`}},
{title:'Eficiencia del CPD (PUE)',unit:7,fields:[['total','Energía total (kWh)',150],['it','Energía TI (kWh)',100]],formula:'PUE = energía total / energía TI',note:'Ambas mediciones deben corresponder al mismo periodo y perímetro.',run:v=>v.it>0&&v.total>=v.it?`PUE: ${fmt(v.total/v.it)}\nEnergía auxiliar: ${fmt(v.total-v.it)} kWh\nPorcentaje TI: ${fmt(v.it/v.total*100)} %`:'La energía TI debe ser positiva y no superar el total.'},
{title:'Consumo y coste eléctrico',unit:7,fields:[['power','Potencia media (W)',500],['hours','Horas de uso al día',24],['days','Días',30],['price','Precio (€/kWh)',0.20]],formula:'kWh = W/1000 × horas/día × días · coste = kWh × €/kWh',note:'Precio introducido por ti; no incluye cargos fijos ni otros conceptos.',run:v=>v.hours<=24?`Energía: ${fmt(v.power/1000*v.hours*v.days)} kWh\nCoste: ${fmt(v.power/1000*v.hours*v.days*v.price)} €`:'Máximo 24 horas al día.'},
{title:'Coste cloud orientativo',unit:8,fields:[['rate','Precio instancia (€/h)',0.1],['hours','Horas facturadas',200],['count','Número de instancias',1],['extra','Otros costes (€)',10]],formula:'Coste = €/h × horas × instancias + otros',note:'Introduce precios de tu proveedor; ejemplo ficticio. No es una tarifa oficial.',run:v=>Number.isInteger(v.count)&&v.count>0?`Cómputo: ${fmt(v.rate*v.hours*v.count)} €\nTotal estimado: ${fmt(v.rate*v.hours*v.count+v.extra)} €`:'Número de instancias entero positivo.'}
];
function toolsPage(){app.innerHTML=title('CALC / LABORATORIO','Calculadoras de hardware','Herramientas de práctica. Cambia cualquier valor para ver el resultado.')+`<div class="grid">${calculators.map((c,i)=>`<section class="panel" id="calc${i}"><span class="tag">UNIDAD ${pad(c.unit)}</span><h3>${esc(c.title)}</h3>${c.fields.map(([key,label,initial,options])=>`<label class="field">${esc(label)}${options?`<select data-field="${key}" onchange="calculate(${i})">${options.map(x=>`<option ${x===initial?'selected':''}>${x}</option>`).join('')}</select>`:`<input type="number" min="0" step="any" value="${initial}" data-field="${key}" oninput="calculate(${i})">`}</label>`).join('')}<p class="formula">${esc(c.formula)}</p><p class="calc-note">${esc(c.note)}</p><div class="calc-result" role="status"></div><button style="margin-top:10px" onclick="resetCalc(${i})">Restablecer</button></section>`).join('')}</div>`;calculators.forEach((_,i)=>calculate(i))}
function calculate(i){const c=calculators[i],el=document.getElementById('calc'+i),fields=[...el.querySelectorAll('[data-field]')];let v={};for(const f of fields){if(f.value===''||!Number.isFinite(+f.value)||+f.value<0){el.querySelector('.calc-result').textContent='Introduce valores válidos no negativos.';return}v[f.dataset.field]=+f.value}el.querySelector('.calc-result').textContent=c.run(v)}
function resetCalc(i){const el=document.getElementById('calc'+i);for(const [k,,v] of calculators[i].fields)el.querySelector(`[data-field="${k}"]`).value=v;calculate(i)}
function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===(current==='unit'?'notes':current)));if(current==='home')home();else if(current==='notes')renderNotes();else if(current==='unit')renderUnit();else if(current==='tools')toolsPage();else if(current==='lab')labPage();else if(current==='quiz')quizPage();else if(current==='search')searchPage()}

let labFilter='all',activeLab='cycle',cycleStep=0,raidFailed=new Set(),memoryOrder=[];
function labSelect(id,items,initial){return `<select id="${id}" onchange="updateLab()">${items.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(initial)?'selected':''}>${esc(t)}</option>`).join('')}</select>`}
function labField(label,body){return `<label class="field">${esc(label)}${body}</label>`}
function labNumber(id,v,min=0,max=10000){return `<input id="${id}" type="number" min="${min}" max="${max}" step="1" value="${v}" oninput="updateLab()">`}
function val(id){return document.getElementById(id).value}function num(id){return Number(val(id))}
function labFeedback(ok,txt){return `<div class="lab-feedback ${ok?'ok':'warn'}"><strong>${ok?'✓':'!'}</strong> ${esc(txt)}</div>`}
function labPage(){const visibleLabs=labDefinitions.filter(x=>labFilter==='all'||String(x.unit)===labFilter);if(visibleLabs.length&&!visibleLabs.some(x=>x.id===activeLab)){activeLab=visibleLabs[0].id;cycleStep=0;raidFailed.clear();memoryOrder=[]}app.innerHTML=title('LAB / SIMULADORES','Laboratorio virtual','Aprende experimentando. Los modelos son simplificados y complementan los apuntes.')+`<div class="controls"><label>Filtrar por unidad <select id="labFilter" onchange="labFilter=this.value;labPage()"><option value="all">Todas</option>${all().map(n=>`<option value="${n}" ${String(n)===labFilter?'selected':''}>Unidad ${pad(n)}</option>`).join('')}</select></label><button onclick="go('tools')">Ver calculadoras</button></div><div class="grid lab-tiles">${labDefinitions.filter(x=>labFilter==='all'||String(x.unit)===labFilter).map(x=>`<button class="tile ${activeLab===x.id?'selected':''}" onclick="openLab('${x.id}')"><span class="num">U${pad(x.unit)} / LAB</span><strong>${esc(x.title)}</strong><span class="muted">${esc(x.description)}</span></button>`).join('')||'<p>Esta unidad dispone de calculadoras en la sección Calculadoras.</p>'}</div><section class="panel lab-work" id="labWork"></section>`;if(visibleLabs.length)renderLab();else document.getElementById('labWork').classList.add('hidden')}
function openLab(id){activeLab=id;cycleStep=0;raidFailed=new Set();memoryOrder=[];labPage();document.getElementById('labWork').scrollIntoView({behavior:'smooth',block:'start'})}
function renderLab(){const e=document.getElementById('labWork');let d=labDefinitions.find(x=>x.id===activeLab);if(!d)return;e.innerHTML=`<p class="eyebrow">UNIDAD ${pad(d.unit)} / PRÁCTICA INTERACTIVA</p><h2>${esc(d.title)}</h2><p class="muted">${esc(d.description)}</p><div id="labInputs"></div><div id="labOutput" aria-live="polite"></div><div class="controls"><button onclick="go('unit',${d.unit})">Leer apuntes de esta unidad</button><button onclick="openLab('${d.id}')">Reiniciar simulación</button></div>`;let a=document.getElementById('labInputs');switch(activeLab){
 case 'cycle':a.innerHTML='<p>Instrucción de ejemplo: sumar 3 + 5. Pulsa avanzar para ejecutar el siguiente paso.</p><div class="controls"><button class="primary" onclick="cycleStep=(cycleStep+1)%4;updateLab()">Avanzar</button></div>';break;
 case 'memory':a.innerHTML='<p>Pulsa las memorias en orden, desde la más rápida. Cada pulsación añade un nivel.</p><div class="controls">'+['SSD/HDD','RAM','Registros','Caché'].map(x=>`<button data-mem="${x}" onclick="if(!memoryOrder.includes(this.dataset.mem))memoryOrder.push(this.dataset.mem);updateLab()">${x}</button>`).join('')+'</div>';break;
 case 'compat':a.innerHTML='<div class="notice">Ejemplo ficticio: placa AM5, DDR5, ATX, 4 ranuras, dual channel. El socket por sí solo no garantiza la compatibilidad real.</div><div class="grid">'+labField('Socket de CPU',labSelect('socket',[['AM5','AM5'],['AM4','AM4'],['LGA','LGA']], 'AM5'))+labField('Generación RAM',labSelect('ddr',[['4','DDR4'],['5','DDR5']],5))+labField('Caja compatible con',labSelect('case',[['ATX','ATX'],['micro','Solo micro-ATX o menor']], 'ATX'))+labField('Módulos idénticos',labSelect('modules',[[1,'1 módulo'],[2,'2 módulos en ranuras recomendadas']],2))+'</div>';break;
 case 'cooling':a.innerHTML='<div class="grid">'+labField('TDP de referencia (W)',labNumber('tdp',125,1))+labField('Capacidad térmica orientativa (W)',labNumber('cooler',180,1))+labField('Flujo de aire',labSelect('air',[['good','Entrada frontal y salida trasera/superior'],['bad','Obstruido o mal orientado']], 'good'))+labField('Pasta térmica',labSelect('paste',[['yes','Aplicada correctamente'],['no','Contacto térmico deficiente']], 'yes'))+'</div>';break;
 case 'pcie':a.innerHTML='<div class="grid">'+labField('Generación PCIe',labSelect('pg',[[3,'3.0'],[4,'4.0'],[5,'5.0']],4))+labField('Reparto hipotético de 16 líneas',labSelect('split',[['single','GPU x16'],['dual','GPU x8 + otra tarjeta x8']], 'single'))+'</div>';break;
 case 'raid':a.innerHTML='<div class="grid">'+labField('Nivel RAID',labSelect('rl',[[0,'RAID 0'],[1,'RAID 1'],[5,'RAID 5'],[6,'RAID 6'],[10,'RAID 10']],5))+labField('Número de discos',labSelect('rn',Array.from({length:7},(_,i)=>[i+2,String(i+2)]),4))+labField('Capacidad por disco (TB)',labNumber('rc',4,1))+'</div>';a.querySelector('#rl').onchange=a.querySelector('#rn').onchange=()=>{raidFailed.clear();updateLab()};break;
 case 'rack':a.innerHTML='<div class="grid">'+labField('Capacidad del rack (U)',labSelect('rackU',[[12,'12U'],[24,'24U'],[42,'42U'],[48,'48U']],42))+labField('Servidores de 2U',labNumber('rackS',12,0,50))+labField('Switches de 1U',labNumber('rackN',2,0,50))+labField('Almacenamiento de 4U',labNumber('rackD',1,0,50))+'</div>';break;
 case 'cloud':a.innerHTML=labField('Modelo de servicio',labSelect('cloudModel',[['local','CPD propio'],['iaas','IaaS'],['paas','PaaS'],['saas','SaaS']], 'iaas'));break;
 case 'migration':a.innerHTML='<div class="grid">'+labField('Origen',labSelect('from',[['P','Físico'],['V','Virtual']], 'P'))+labField('Destino',labSelect('to',[['P','Físico'],['V','Virtual']], 'V'))+'</div>';break;
 case 'backup':a.innerHTML='<div class="grid">'+labField('Copias totales, incluido original',labNumber('bc',3,1,20))+labField('Tipos de soportes o sistemas',labNumber('bm',2,1,20))+labField('Copias fuera de la ubicación principal',labNumber('bo',1,0,20))+'</div><div class="controls"><label><input type="checkbox" id="immutable" onchange="updateLab()"> Copia inmutable o aislada</label><label><input type="checkbox" id="restore" onchange="updateLab()"> Restauración verificada</label></div>';break;
 }updateLab()}
function updateLab(){const o=document.getElementById('labOutput');if(!o)return;let h='';switch(activeLab){
 case 'cycle':{const names=['Preparación','FETCH','DECODE','EXECUTE'];const desc=['La instrucción SUMAR 3 + 5 está en memoria.','La CPU busca la instrucción indicada por el contador de programa.','La unidad de control interpreta la instrucción y prepara los operandos.','La ALU suma 3 + 5 y el resultado 8 se guarda. El ciclo continúa.'];h=`<div class="lab-chain">${names.map((n,i)=>`<div class="lab-chip ${i===cycleStep?'hot':''}">${n}</div>`).join('<span>→</span>')}</div><p>${desc[cycleStep]}</p>`;break}
 case 'memory':{const correct=['Registros','Caché','RAM','SSD/HDD'];document.querySelectorAll('[data-mem]').forEach(b=>b.disabled=memoryOrder.includes(b.dataset.mem));h=`<div class="lab-chain">${memoryOrder.map(x=>`<div class="lab-chip">${x}</div>`).join('<span>→</span>')}</div>`+(memoryOrder.length===4?labFeedback(memoryOrder.every((x,i)=>x===correct[i]),'Orden correcto: Registros → Caché → RAM → SSD/HDD. Cerca de la CPU: más velocidad y coste por bit, menos capacidad.'):'<p class="muted">Selecciona cuatro niveles.</p>');break}
 case 'compat':{let checks=[['Socket AM5',val('socket')==='AM5'],['DDR5',val('ddr')==='5'],['Caja ATX',val('case')==='ATX']];h=checks.map(([s,b])=>labFeedback(b,s+(b?' compatible':' incompatible'))).join('')+`<p>Modo previsto: <strong>${num('modules')===2?'dual channel':'single channel'}</strong>. Comprueba el manual y las ranuras recomendadas.</p>`;break}
 case 'cooling':{const t=num('tdp'),c=num('cooler');if(t<=0||c<=0){h=labFeedback(false,'Introduce referencias térmicas positivas.');break}let ok=c>=t&&val('air')==='good'&&val('paste')==='yes';h=labFeedback(ok,ok?'Dimensionamiento inicial razonable en este modelo.':'Revisa capacidad térmica, flujo de aire y contacto térmico.')+`<p>Margen térmico nominal: ${fmt(c-t)} W. No permite calcular grados Celsius: el consumo real, disipador, ambiente y ventilación influyen.</p><div class="lab-chain"><div class="lab-chip cold">Aire frío</div><span>→</span><div class="lab-chip">CPU / GPU</div><span>→</span><div class="lab-chip hot">Aire caliente</div></div>`;break}
 case 'pcie':{let n=val('split')==='single'?16:8,s={3:8,4:16,5:32}[num('pg')]*128/130/8;h=`<div class="lane-strip">${Array.from({length:16},(_,i)=>`<span class="${i<n?'lane-gpu':'lane-other'}"></span>`).join('')}</div><p>GPU: ${n} líneas · <strong>${fmt(n*s)} GB/s</strong> por dirección.</p>${n===8?`<p>Otra tarjeta: 8 líneas · ${fmt(8*s)} GB/s.</p>`:''}<p class="muted">El reparto depende de la placa; reducir ancho de banda no implica reducir el rendimiento en igual proporción.</p>`;break}
 case 'raid':{let l=num('rl'),n=num('rn'),c=num('rc'),valid=c>0&&n>={0:2,1:2,5:3,6:4,10:4}[l]&&!(l===10&&n%2)&&!(l===1&&n!==2);if(!valid){h=labFeedback(false,'Configuración no válida: RAID 1 se modela como pareja y RAID 10 necesita un número par de discos ≥ 4.');break}let f=raidFailed.size,ok=l===0?f===0:l===1?f<2:l===5?f<=1:l===6?f<=2:![...raidFailed].some(i=>raidFailed.has(i^1));let useful={0:n,1:1,5:n-1,6:n-2,10:n/2}[l]*c;h=`<p>Capacidad bruta: ${fmt(n*c)} TB · Útil teórica: <strong>${fmt(useful)} TB</strong></p><p class="muted">Pulsa un disco para alternar su estado.</p><div class="disk-grid">${Array.from({length:n},(_,i)=>`<button class="disk ${raidFailed.has(i)?'failed':''}" onclick="raidFailed.has(${i})?raidFailed.delete(${i}):raidFailed.add(${i});updateLab()">▤<br>Disco ${i+1}<small>${raidFailed.has(i)?'Averiado':'Operativo'}${l===10?' · Espejo '+(Math.floor(i/2)+1):''}</small></button>`).join('')}</div>`+labFeedback(ok,ok?(f?'Conjunto degradado: datos disponibles en el modelo.':'Conjunto operativo.'):'Conjunto no recuperable con la redundancia del modelo.')+'<p class="muted">Simulación de fallos simultáneos sin reconstrucción; no equivale a una reparación. RAID no es backup.</p>';break}
 case 'rack':{const cap=num('rackU'),counts=[num('rackS'),num('rackN'),num('rackD')];if(counts.some(x=>!Number.isInteger(x)||x<0||x>50)){h=labFeedback(false,'Introduce cantidades enteras entre 0 y 50.');break}const u=counts[0]*2+counts[1]+counts[2]*4;let cells=[...Array(counts[0]*2).fill('Servidor'),...Array(counts[1]).fill('Switch'),...Array(counts[2]*4).fill('Disco')];h=`<p><strong>${u} / ${cap} U</strong> · ${u<=cap?(cap-u)+' U libres':(u-cap)+' U de exceso'} · ${fmt(u/cap*100)} %</p><div class="rack-grid">${Array.from({length:cap},(_,i)=>`<div class="rack-slot ${cells[i]?'occupied':''}"><span>U${cap-i}</span><span>${cells[i]||'Libre'}</span></div>`).join('')}</div>`+labFeedback(u<=cap,u<=cap?'Cabe por altura. Verifica potencia, peso, profundidad y refrigeración.':'No cabe por altura.');break}
 case 'cloud':{const m=val('cloudModel'),layers=['Hardware y red física','Virtualización','Sistema operativo','Entorno de ejecución','Aplicación','Datos, permisos y accesos'];let count={local:0,iaas:2,paas:4,saas:5}[m];h='<div class="cloud-layers">'+layers.map((x,i)=>`<div class="cloud-layer ${i<count?'provider':''}"><span>${x}</span><strong>${i<count?'Proveedor':i===5&&m==='saas'?'Compartida':'Cliente'}</strong></div>`).join('')+'</div><p class="muted">Reparto orientativo; el servicio concreto puede variar. El cliente mantiene responsabilidades sobre sus datos y accesos.</p>';break}
 case 'migration':{const f=val('from'),t=val('to'),type=f+'2'+t;const d={P2P:'Trasladar un equipo a otro equipo físico.',P2V:'Convertir un equipo físico en una máquina virtual.',V2P:'Trasladar una máquina virtual a un equipo físico.',V2V:'Trasladar una máquina virtual a otra plataforma virtual.'};h=`<div class="lab-chain"><div class="lab-chip">${f==='P'?'Equipo físico':'Máquina virtual'}</div><span>→</span><div class="lab-chip hot">${type}</div><span>→</span><div class="lab-chip">${t==='P'?'Equipo físico':'Máquina virtual'}</div></div><p>${d[type]}</p><p>Antes de retirar el origen: copia, conversión, validación de arranque, datos y servicios.</p>`;break}
 case 'backup':{const c=num('bc'),m=num('bm'),b=num('bo'),im=document.getElementById('immutable').checked,r=document.getElementById('restore').checked;if(![c,m,b].every(Number.isInteger)||c<1||m<1||b<0||m>c||b>=c){h=labFeedback(false,'Revisa las cantidades: los soportes no pueden superar las copias y el original permanece en la ubicación principal.');break}h=labFeedback(c>=3,'3: '+c+' copias totales')+labFeedback(m>=2,'2: '+m+' tipos de soportes o sistemas')+labFeedback(b>=1,'1: '+b+' copia(s) externa(s)')+labFeedback(im,'Protección adicional: '+(im?'copia aislada o inmutable':'pendiente'))+labFeedback(r,'Restauración: '+(r?'verificada':'pendiente'));break}
 }o.innerHTML=h}
// The calculator area also provides filtering by topic.
let calcFilter='all';const oldToolsPage=toolsPage;
toolsPage=function(){oldToolsPage();const box=document.createElement('div');box.className='controls';box.innerHTML=`<label>Unidad <select id="calcFilter"><option value="all">Todas</option>${[...new Set(calculators.map(c=>c.unit))].sort((a,b)=>a-b).map(n=>`<option value="${n}">Unidad ${pad(n)}</option>`).join('')}</select></label><button onclick="go('lab')">Abrir simuladores</button>`;app.querySelector('.hero').after(box);const sel=box.querySelector('select');sel.value=calcFilter;const apply=()=>{calcFilter=sel.value;calculators.forEach((c,i)=>document.getElementById('calc'+i).classList.toggle('hidden',calcFilter!=='all'&&String(c.unit)!==calcFilter))};sel.onchange=apply;apply()};

render();route();loadRepo();
</script></body></html>
