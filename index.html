const DATA={"5": {"title": "Tarjetas de expansión", "markdown": "<div align=\"center\">\n\n<img src=\"https://readme-typing-svg.demolab.com?font=JetBrains+Mono&weight=700&size=30&color=FF334F&center=true&vCenter=true&width=650&height=60&repeat=false&lines=UNIDAD+05\" alt=\"Unidad 05\" />\n\n# Tarjetas de expansión\n\n`Fundamentos de Hardware | ASIR`\n\n<img src=\"https://img.shields.io/badge/ASIR-HARDWARE-CE1141?style=for-the-badge&labelColor=202020\" />\n\n<\/div>\n\n---\n\n[← Volver al temario](../README.md) · [Hardware Lab](../index.html)\n\n## Índice\n\n- [1. Tarjetas de expansión](#1-tarjetas-de-expansión)\n- [2. Buses y protocolos de comunicación](#2-buses-y-protocolos-de-comunicación)\n- [3. Protocolos de comunicación inalámbrica](#3-protocolos-de-comunicación-inalámbrica)\n- [4. Ampliación y actualización](#4-ampliación-y-actualización)\n- [5. Conceptos clave](#5-conceptos-clave)\n- [6. Preguntas de repaso](#6-preguntas-de-repaso)\n- [7. Práctica](#7-práctica)\n\n---\n\n## 1. Tarjetas de expansión\n\nReferencia: PDF, páginas 4–6.\n\nLas tarjetas de expansión añaden funciones o aumentan las prestaciones de un ordenador sin sustituir toda la placa base. Se conectan mediante interfaces como PCIe. Muchas funciones básicas ya vienen integradas.\n\n### 1.1. Tarjeta gráfica (GPU)\n\nLa GPU genera las imágenes que llegan al monitor y realiza operaciones masivamente paralelas. La VRAM es la memoria utilizada por la GPU para texturas, imágenes y otros datos.\n\n| Característica | Integrada (iGPU) | Dedicada |\n|---|---|---|\n| Ubicación | Integrada en el procesador | Tarjeta independiente, normalmente PCIe x16 |\n| Memoria | Comparte RAM del sistema | VRAM propia, normalmente |\n| Uso | Ofimática y uso general | Juegos, diseño, vídeo, IA y cálculo científico |\n| Consumo | Habitualmente bajo | Puede ser muy elevado |\n| Refrigeración | Suele compartir la del procesador | Requiere refrigeración propia y espacio |\n\nUna GPU dedicada necesita una fuente y refrigeración dimensionadas correctamente (UT3). No todos los equipos necesitan una: selecciona según la carga de trabajo.\n\n### 1.2. Sonido, red y periféricos\n\n| Elemento | Función | Cuándo ampliar |\n|---|---|---|\n| Tarjeta de sonido | Procesar entradas y salidas de audio | Audio profesional |\n| NIC (Network Interface Card) | Conectar a una red | 10 GbE, fibra, puertos adicionales |\n| Tarjeta de expansión | Añadir conectividad o funciones | Captura, más puertos, controladoras |\n| Periférico de entrada | Introducir información | Teclado, ratón, escáner |\n| Periférico de salida | Mostrar información | Monitor, impresora |\n| Periférico de E/S | Entrada y salida | Pantalla táctil |\n\nEjemplo: si un servidor dispone de una NIC de 1 GbE y necesita más caudal, puede instalar una de 10 GbE compatible. El resto de la red también debe admitir esa velocidad.\n\n---\n\n## 2. Buses y protocolos de comunicación\n\nReferencia: PDF, páginas 7–10.\n\n### 2.1. PCI Express (PCIe)\n\nBus serie de alta velocidad que comunica tarjetas y almacenamiento con la placa. Se organiza en líneas o *lanes*. El ancho de banda depende de la generación y el número de líneas activas.\n\n| Conexión | Líneas | Uso típico |\n|---|---:|---|\n| x1 | 1 | Sonido, puertos adicionales, tarjetas pequeñas |\n| x4 | 4 | SSD NVMe |\n| x8 | 8 | NIC de servidor o GPU con líneas compartidas |\n| x16 | 16 | GPU |\n\nCada generación 3.0, 4.0 y 5.0 aproximadamente duplica el caudal por línea. La ranura física puede tener menos líneas eléctricas de las que aparenta.\n\n```mermaid\nflowchart TD\n A[CPU: 16 líneas disponibles] --> B[GPU x16 si está sola]\n A --> C[GPU x8 si se reparten]\n A --> D[Otra tarjeta x8]\n style A fill:#CE1141,color:#fff\n```\n\nEl esquema ilustra dos alternativas de reparto (no simultáneas). Consulta el manual de la placa: ocupar una segunda ranura o un M.2 puede reducir las líneas disponibles en determinadas plataformas. Una GPU x8 no pierde necesariamente la mitad de los FPS, aunque su enlace tenga la mitad de ancho de banda.\n\n### Tabla de velocidades (complementaria)\n\nValores teóricos aproximados **por dirección**, para PCIe 3.0–5.0 con codificación 128b/130b. El rendimiento de aplicaciones es inferior o depende de otros factores.\n\n| Generación | x1 GB/s | x4 GB/s | x8 GB/s | x16 GB/s |\n|---|---:|---:|---:|---:|\n| PCIe 3.0 | 0,985 | 3,94 | 7,88 | 15,75 |\n| PCIe 4.0 | 1,969 | 7,88 | 15,75 | 31,51 |\n| PCIe 5.0 | 3,938 | 15,75 | 31,51 | 63,02 |\n\nPCIe 4.0 x8 tiene aproximadamente el mismo ancho de banda que PCIe 3.0 x16. Fórmula complementaria: `GB/s = GT/s × (128/130) × líneas / 8`. Las tasas por línea son 8, 16 y 32 GT/s respectivamente.\n\n### 2.2. USB\n\nUniversal Serial Bus: conecta periféricos externos con plug and play y también puede suministrar energía. USB Power Delivery permite negociar alimentación si ambos dispositivos y el cable son compatibles.\n\n| Versión (ejemplos complementarios) | Tasa nominal de señalización |\n|---|---:|\n| USB 2.0 | 480 Mb/s |\n| USB 3.x | 5, 10 o 20 Gb/s según variante |\n| USB4 | 20 o 40 Gb/s en variantes habituales |\n| USB4 versión 2 | Hasta 80 Gb/s bidireccionales en modos compatibles |\n\nType-A es el conector tradicional; Type-C es reversible. **USB-C describe la forma, no garantiza velocidad, vídeo ni carga.** Comprueba versión, cable, puerto y dispositivo.\n\n### 2.3. SATA, SAS y NVMe\n\n| Interfaz/protocolo | Aplicación | Rendimiento |\n|---|---|---|\n| SATA | HDD y SSD básicos | Limitado; SATA III: 6 Gb/s nominales |\n| SAS | Servidores y almacenamiento profesional | Mayor fiabilidad y prestaciones; tasas según generación |\n| NVMe | SSD conectados por PCIe, M.2 o tarjeta | Muy alto; depende de PCIe y de la unidad |\n\nSATA y SAS son interfaces de almacenamiento; SAS es una tecnología de la familia SCSI, no simplemente una versión de SATA. NVMe es un protocolo diseñado para memoria no volátil sobre PCIe. M.2 es un formato, no una garantía de NVMe.\n\n### 2.4. Thunderbolt\n\nInterfaz externa de alto rendimiento desarrollada por Intel y Apple. Utiliza USB-C en generaciones modernas y puede transportar datos, vídeo (DisplayPort), PCIe y energía, conectar docks, pantallas y discos rápidos y encadenar dispositivos (*daisy chain*).\n\n| Tecnología | Tasa nominal complementaria |\n|---|---:|\n| Thunderbolt 4 | 40 Gb/s |\n| Thunderbolt 5 | 80 Gb/s bidireccionales; hasta 120 Gb/s en un sentido en modo de vídeo compatible |\n\nUSB4 y Thunderbolt convergen en el conector y ciertas capacidades, pero no todos los puertos USB4 ofrecen todas las funciones Thunderbolt. Consulta especificaciones de los equipos y cables.\n\n### Caso práctico\n\nGPU → PCIe x16; SSD del sistema → M.2 NVMe; teclado/ratón → USB; pantalla y disco externo de alto rendimiento → Thunderbolt o USB4 compatible. Revisa las líneas compartidas y no confundas conector y protocolo.\n\n---\n\n## 3. Protocolos de comunicación inalámbrica\n\nReferencia: PDF, páginas 10–11.\n\n### 3.1. Wi-Fi\n\nBasado en IEEE 802.11 y certificado por Wi-Fi Alliance. La tarjeta Wi-Fi y sus antenas determinan las bandas y estándares aprovechables.\n\n| Banda | Característica |\n|---|---|\n| 2,4 GHz | Mayor alcance y penetración; más saturación |\n| 5 GHz | Más capacidad y generalmente menos interferencias; menor alcance |\n| 6 GHz | Más espectro disponible; requiere compatibilidad; Wi-Fi 7 permite canales de hasta 320 MHz donde estén disponibles |\n\n| Generación | Norma (aclaración complementaria) |\n|---|---|\n| Wi-Fi 5 | 802.11ac |\n| Wi-Fi 6 | 802.11ax |\n| Wi-Fi 6E | 802.11ax extendido a 6 GHz |\n| Wi-Fi 7 | 802.11be |\n\nLas generaciones mejoran rendimiento y eficiencia con muchos dispositivos. El temario destaca WPA3 como requisito de las certificaciones Wi-Fi modernas. WPA3 refuerza la autenticación y la protección frente a intentos de adivinar contraseñas; comprueba la compatibilidad y no uses protocolos obsoletos. La tarjeta puede ser integrada, M.2 o USB.\n\n### 3.2. Bluetooth y NFC\n\n| Protocolo | Frecuencia | Uso |\n|---|---|---|\n| Bluetooth clásico (BR/EDR) | 2,4 GHz | Audio y datos, periféricos |\n| Bluetooth Low Energy (BLE) | 2,4 GHz | Sensores y dispositivos de bajo consumo |\n| NFC | 13,56 MHz | Comunicación a pocos centímetros, pagos, accesos y emparejamiento |\n| Wi-Fi | 2,4/5/6 GHz | Red local inalámbrica |\n\nEl alcance reducido de NFC ayuda a limitar la exposición, pero no sustituye la autenticación. El emparejamiento autoriza dispositivos: revisa los vinculados, evita emparejamientos desconocidos y desactiva radios innecesarias.\n\n---\n\n## 4. Ampliación y actualización\n\nReferencia: PDF, páginas 11–13.\n\nPCIe 5.0 y la evolución hacia 6.0 aumentan el ancho de banda. USB4, USB4 v2 y Thunderbolt 4/5 reúnen datos, vídeo y energía en equipos compatibles, aunque debe verificarse cada versión.\n\nLas GPU de centro de datos aceleran entrenamiento e inferencia de IA, análisis de datos y computación científica. Utilizan memoria de alto ancho de banda (HBM, UT4) y conexiones PCIe o interconexiones especializadas. Dimensionar un sistema de IA requiere valorar GPU, memoria, alimentación y refrigeración, no solo CPU.\n\n---\n\n## 5. Conceptos clave\n\n| Concepto | Definición rápida |\n|---|---|\n| GPU | Procesador especializado en gráficos y paralelismo. |\n| iGPU | Gráfica integrada. |\n| VRAM | Memoria utilizada por la GPU. |\n| NIC | Tarjeta de interfaz de red. |\n| PCIe | Bus serie de alta velocidad. |\n| Lane | Línea de comunicación PCIe. |\n| USB | Interfaz universal de periféricos. |\n| USB-C | Conector reversible, no una velocidad. |\n| SATA | Interfaz de almacenamiento. |\n| SAS | Interfaz profesional de la familia SCSI. |\n| NVMe | Protocolo de almacenamiento sobre PCIe. |\n| Thunderbolt | Interfaz de datos, vídeo y energía. |\n| Wi-Fi | Red inalámbrica IEEE 802.11. |\n| WPA3 | Protocolo de seguridad Wi-Fi. |\n| BLE | Bluetooth de bajo consumo. |\n| NFC | Comunicación de proximidad. |\n\n---\n\n## 6. Preguntas de repaso\n\nIntenta responder antes de desplegar la solución.\n\n<details>\n<summary>01. ¿Qué aporta una tarjeta de expansión?<\/summary>\n\nAñade funcionalidades o prestaciones.\n\n<\/details>\n\n<details>\n<summary>02. ¿Qué diferencia una iGPU de una dedicada?<\/summary>\n\nLa integrada comparte recursos del sistema; la dedicada suele tener VRAM propia y mayor capacidad de cálculo.\n\n<\/details>\n\n<details>\n<summary>03. ¿Qué es VRAM?<\/summary>\n\nMemoria utilizada por el procesador gráfico.\n\n<\/details>\n\n<details>\n<summary>04. ¿Cuándo interesa una NIC dedicada?<\/summary>\n\nPara más velocidad, fibra o más puertos.\n\n<\/details>\n\n<details>\n<summary>05. ¿Qué es un periférico de E/S?<\/summary>\n\nUn dispositivo que recibe y emite información, como una pantalla táctil.\n\n<\/details>\n\n<details>\n<summary>06. ¿Qué es PCIe?<\/summary>\n\nUn bus serie de alta velocidad organizado en líneas.\n\n<\/details>\n\n<details>\n<summary>07. ¿Cuántas líneas tiene x4?<\/summary>\n\nCuatro líneas.\n\n<\/details>\n\n<details>\n<summary>08. ¿Qué determina el ancho de banda PCIe?<\/summary>\n\nLa generación y las líneas activas.\n\n<\/details>\n\n<details>\n<summary>09. ¿Dónde se conecta habitualmente una GPU?<\/summary>\n\nEn una ranura PCIe x16.\n\n<\/details>\n\n<details>\n<summary>10. ¿Dónde se conecta un SSD NVMe típico?<\/summary>\n\nEn M.2 PCIe x4 u otra conexión PCIe compatible.\n\n<\/details>\n\n<details>\n<summary>11. ¿Qué ocurre si dos tarjetas comparten 16 líneas en x8/x8?<\/summary>\n\nCada una recibe ocho líneas; el caudal máximo de cada enlace se reduce respecto a x16.\n\n<\/details>\n\n<details>\n<summary>12. ¿Es USB-C siempre rápido?<\/summary>\n\nNo, es un conector; depende de la versión y capacidades.\n\n<\/details>\n\n<details>\n<summary>13. ¿Qué aporta USB Power Delivery?<\/summary>\n\nNegociación de alimentación compatible.\n\n<\/details>\n\n<details>\n<summary>14. ¿Qué diferencia SAS de SATA?<\/summary>\n\nSAS está orientada al almacenamiento profesional y ofrece funciones como doble puerto.\n\n<\/details>\n\n<details>\n<summary>15. ¿Qué diferencia M.2 y NVMe?<\/summary>\n\nM.2 es el formato; NVMe es un protocolo sobre PCIe.\n\n<\/details>\n\n<details>\n<summary>16. ¿Qué combina Thunderbolt?<\/summary>\n\nDatos, vídeo y energía; admite docks y encadenamiento compatible.\n\n<\/details>\n\n<details>\n<summary>17. ¿Qué norma utiliza Wi-Fi?<\/summary>\n\nIEEE 802.11.\n\n<\/details>\n\n<details>\n<summary>18. ¿Qué banda Wi-Fi suele llegar más lejos?<\/summary>\n\n2,4 GHz.\n\n<\/details>\n\n<details>\n<summary>19. ¿Qué aporta Wi-Fi 6E?<\/summary>\n\nLa posibilidad de utilizar la banda de 6 GHz.\n\n<\/details>\n\n<details>\n<summary>20. ¿Qué es WPA3?<\/summary>\n\nUna tecnología de seguridad Wi-Fi.\n\n<\/details>\n\n<details>\n<summary>21. ¿Qué diferencia Bluetooth clásico y BLE?<\/summary>\n\nEl clásico se usa en audio y datos; BLE reduce el consumo.\n\n<\/details>\n\n<details>\n<summary>22. ¿A qué frecuencia trabaja NFC?<\/summary>\n\n13,56 MHz.\n\n<\/details>\n\n<details>\n<summary>23. ¿Por qué hay que revisar los emparejamientos?<\/summary>\n\nPorque los dispositivos vinculados quedan autorizados a comunicarse.\n\n<\/details>\n\n<details>\n<summary>24. ¿Qué hace útil la GPU para IA?<\/summary>\n\nSu capacidad de cálculo masivamente paralelo.\n\n<\/details>\n\n<details>\n<summary>25. ¿Cuál es el caudal teórico de PCIe 4.0 x8?<\/summary>\n\nAproximadamente 15,75 GB/s por dirección.\n\n<\/details>\n\n---\n\n## 7. Práctica\n\n- [ ] Identificar GPU, NIC, sonido y periféricos de un equipo.\n- [ ] Consultar el manual de la placa y dibujar el reparto de líneas PCIe.\n- [ ] Elaborar una tabla de velocidades USB, SATA, SAS, NVMe y Thunderbolt consultando las especificaciones.\n- [ ] Comparar x8 y x16 y justificar cuándo importa la diferencia.\n- [ ] Elegir interfaz óptima para cada dispositivo y revisar las bandas Wi-Fi compatibles.\n\n**Entregable del temario:** tabla de velocidades y análisis PCIe x8 frente a x16.\n\n---\n\n## Resumen final\n\nLas tarjetas amplían funciones; la GPU dedicada es útil para gráficos y cálculo paralelo. PCIe escala por generación y líneas. USB-C y M.2 describen formatos, no garantizan velocidad. SATA y SAS sirven para almacenamiento; NVMe aprovecha PCIe. Thunderbolt combina datos, vídeo y energía. Wi-Fi, Bluetooth y NFC cubren distintos alcances y usos; la seguridad y compatibilidad son imprescindibles.\n\n---\n\nFuente: Fundamentos de Hardware, Unidad 5. Prometeo - thePower. Apuntes personales. Los ejemplos y matices identificados como complementarios son material de apoyo.\n\n<div align=\"center\">\n\n`UNIDAD 05 | FUNDAMENTOS DE HARDWARE`\n\n[Volver al temario](../README.md)\n\n<\/div>\n", "questions": [["¿Qué aporta una tarjeta de expansión?", "Añade funcionalidades o prestaciones."], ["¿Qué diferencia una iGPU de una dedicada?", "La integrada comparte recursos del sistema; la dedicada suele tener VRAM propia y mayor capacidad de cálculo."], ["¿Qué es VRAM?", "Memoria utilizada por el procesador gráfico."], ["¿Cuándo interesa una NIC dedicada?", "Para más velocidad, fibra o más puertos."], ["¿Qué es un periférico de E/S?", "Un dispositivo que recibe y emite información, como una pantalla táctil."], ["¿Qué es PCIe?", "Un bus serie de alta velocidad organizado en líneas."], ["¿Cuántas líneas tiene x4?", "Cuatro líneas."], ["¿Qué determina el ancho de banda PCIe?", "La generación y las líneas activas."], ["¿Dónde se conecta habitualmente una GPU?", "En una ranura PCIe x16."], ["¿Dónde se conecta un SSD NVMe típico?", "En M.2 PCIe x4 u otra conexión PCIe compatible."], ["¿Qué ocurre si dos tarjetas comparten 16 líneas en x8/x8?", "Cada una recibe ocho líneas; el caudal máximo de cada enlace se reduce respecto a x16."], ["¿Es USB-C siempre rápido?", "No, es un conector; depende de la versión y capacidades."], ["¿Qué aporta USB Power Delivery?", "Negociación de alimentación compatible."], ["¿Qué diferencia SAS de SATA?", "SAS está orientada al almacenamiento profesional y ofrece funciones como doble puerto."], ["¿Qué diferencia M.2 y NVMe?", "M.2 es el formato; NVMe es un protocolo sobre PCIe."], ["¿Qué combina Thunderbolt?", "Datos, vídeo y energía; admite docks y encadenamiento compatible."], ["¿Qué norma utiliza Wi-Fi?", "IEEE 802.11."], ["¿Qué banda Wi-Fi suele llegar más lejos?", "2,4 GHz."], ["¿Qué aporta Wi-Fi 6E?", "La posibilidad de utilizar la banda de 6 GHz."], ["¿Qué es WPA3?", "Una tecnología de seguridad Wi-Fi."], ["¿Qué diferencia Bluetooth clásico y BLE?", "El clásico se usa en audio y datos; BLE reduce el consumo."], ["¿A qué frecuencia trabaja NFC?", "13,56 MHz."], ["¿Por qué hay que revisar los emparejamientos?", "Porque los dispositivos vinculados quedan autorizados a comunicarse."], ["¿Qué hace útil la GPU para IA?", "Su capacidad de cálculo masivamente paralelo."], ["¿Cuál es el caudal teórico de PCIe 4.0 x8?", "Aproximadamente 15,75 GB/s por dirección."]], "summary": "Las tarjetas amplían funciones; la GPU dedicada es útil para gráficos y cálculo paralelo. PCIe escala por generación y líneas. USB-C y M.2 describen formatos, no garantizan velocidad. SATA y SAS sirven para almacenamiento; NVMe aprovecha PCIe. Thunderbolt combina datos, vídeo y energía. Wi-Fi, Bluetooth y NFC cubren distintos alcances y usos; la seguridad y compatibilidad son imprescindibles."}, "6": {"title": "Almacenamiento secundario", "markdown": "<div align=\"center\">\n\n<img src=\"https://readme-typing-svg.demolab.com?font=JetBrains+Mono&weight=700&size=30&color=FF334F&center=true&vCenter=true&width=650&height=60&repeat=false&lines=UNIDAD+06\" alt=\"Unidad 06\" />\n\n# Almacenamiento secundario\n\n`Fundamentos de Hardware | ASIR`\n\n<img src=\"https://img.shields.io/badge/ASIR-HARDWARE-CE1141?style=for-the-badge&labelColor=202020\" />\n\n<\/div>\n\n---\n\n[← Volver al temario](../README.md) · [Hardware Lab](../index.html)\n\n## Índice\n\n- [1. HDD y SSD](#1-hdd-y-ssd)\n- [2. Interfaces de almacenamiento y RAID](#2-interfaces-de-almacenamiento-y-raid)\n- [3. NAS y casos de uso](#3-nas-y-casos-de-uso)\n- [4. Ampliación y actualización](#4-ampliación-y-actualización)\n- [5. Conceptos clave](#5-conceptos-clave)\n- [6. Preguntas de repaso](#6-preguntas-de-repaso)\n- [7. Práctica](#7-práctica)\n\n---\n\n## 1. HDD y SSD\n\nReferencia: PDF, páginas 4–8.\n\nEl almacenamiento secundario conserva los datos sin corriente, a diferencia de la RAM. Se utiliza para sistemas operativos, aplicaciones, archivos y copias de seguridad.\n\n### 1.1. Disco duro mecánico (HDD)\n\nHard Disk Drive: guarda datos magnéticamente en platos giratorios. Un cabezal se desplaza para leer y escribir. La velocidad depende de las RPM (5.400 o 7.200 son ejemplos habituales), la caché y los tiempos de acceso mecánicos. Tiene buena capacidad por euro, pero es sensible a golpes y más lento y ruidoso.\n\n### 1.2. Unidad de estado sólido (SSD)\n\nSolid State Drive: almacena datos en celdas de memoria flash NAND, sin partes móviles. Ofrece menor latencia, más velocidad de arranque y carga de aplicaciones, silencio y resistencia a golpes. Su coste por GB suele ser mayor y la memoria tiene una resistencia de escritura finita. Los HDD también pueden sufrir desgaste y fallos.\n\n| Característica | HDD | SSD |\n|---|---|---|\n| Tecnología | Platos y cabezal | Flash NAND |\n| Acceso | Mecánico | Electrónico |\n| Velocidad | Menor | Mayor |\n| Coste por GB | Habitualmente menor | Habitualmente mayor |\n| Ruido y vibración | Sí | No por partes móviles |\n| Consumo | Generalmente mayor | Generalmente menor |\n| Uso | Archivo y copias masivas | Sistema y aplicaciones |\n\nUna configuración equilibrada combina un SSD para el sistema y programas con HDD para grandes volúmenes de datos.\n\n### 1.3. Formatos de SSD\n\n| Formato | Interfaz/protocolo | Observación |\n|---|---|---|\n| 2,5 pulgadas | SATA | Con cables de datos y alimentación |\n| M.2 SATA | SATA | Compacto, limitado por SATA |\n| M.2 NVMe | PCIe / NVMe | Compacto y de alto rendimiento |\n| Tarjeta PCIe | PCIe / NVMe | Se instala en ranura de expansión |\n| U.2 / EDSFF | Según plataforma, frecuentemente NVMe | Entornos de servidor |\n\n> [!IMPORTANT]\n> M.2 define un formato físico; no indica automáticamente que la unidad sea NVMe. Comprueba la compatibilidad del conector y protocolo.\n\n### 1.4. Fragmentación, desfragmentación y TRIM\n\nLa fragmentación aparece cuando un archivo ocupa bloques dispersos. En un HDD el cabezal debe desplazarse más, lo que penaliza las operaciones. Desfragmentar reorganiza los fragmentos en zonas contiguas.\n\nEn un SSD no hay cabezal, por lo que la desfragmentación periódica tradicional no aporta ese beneficio y genera escrituras. TRIM informa al SSD de bloques que ya no utiliza el sistema de archivos y facilita su gestión interna.\n\n```mermaid\nflowchart TD\n A[Optimización de unidades] --> B[HDD]\n A --> C[SSD]\n B --> D[Desfragmentación cuando procede]\n C --> E[TRIM]\n style A fill:#CE1141,color:#fff\n```\n\nWindows ofrece la utilidad Optimizar unidades y selecciona la operación según el soporte. Linux utiliza `fstrim` para descartar bloques libres de sistemas de archivos montados; una frecuencia semanal suele ser suficiente según el temario. Es preferible usar la programación del sistema, sin forzar operaciones innecesarias.\n\n---\n\n## 2. Interfaces de almacenamiento y RAID\n\nReferencia: PDF, páginas 8–10.\n\n### 2.1. Interfaces\n\n| Interfaz | Uso | Particularidad |\n|---|---|---|\n| SATA | HDD y SSD básicos | Económica y muy extendida |\n| SAS | Servidores | Funciones profesionales como doble puerto y más dispositivos |\n| NVMe sobre PCIe | SSD de alto rendimiento | Aprovecha líneas PCIe; gran ancho de banda |\n\nAclaración complementaria: SATA III ofrece 6 Gb/s de señalización nominal y los SSD SATA suelen acercarse a 500–550 MB/s secuenciales. Un SSD NVMe PCIe 4.0 x4 tiene un techo de enlace aproximado de 7,88 GB/s por dirección; la unidad real puede rendir menos.\n\n### 2.2. RAID\n\nRedundant Array of Independent Disks: combina discos en un conjunto lógico para mejorar capacidad, rendimiento y/o tolerancia a fallos. *Striping* reparte datos, *mirroring* los duplica y la paridad permite reconstruir datos perdidos mediante información redundante.\n\n| Nivel | Mínimo de discos | Capacidad útil (discos iguales) | Fallos tolerados | Uso |\n|---|---:|---|---|---|\n| RAID 0 | 2 | N × C | 0 | Rendimiento, datos prescindibles |\n| RAID 1 | 2 | C (espejo de dos) | 1 en pareja | Redundancia sencilla |\n| RAID 5 | 3 | (N − 1) × C | 1 | Capacidad y redundancia |\n| RAID 6 | 4 | (N − 2) × C | 2 | Mayor tolerancia |\n| RAID 10 | 4, número par | N × C / 2 | 1 garantizado; más si en espejos distintos | Escrituras y reconstrucción rápida |\n\nN = número de discos; C = capacidad del menor disco. Las fórmulas son complementarias; no descuentan metadatos, formato ni discos de reserva.\n\n```mermaid\nflowchart TD\n A[RAID] --> B[0: reparto]\n A --> C[1: espejo]\n A --> D[5 / 6: paridad]\n A --> E[10: reparto de espejos]\n style A fill:#CE1141,color:#fff\n```\n\n| Nivel | Esquema conceptual |\n|---|---|\n| 0 | Disco A: bloques A,C; Disco B: B,D |\n| 1 | Disco A: A,B; Disco B: A,B |\n| 5 | Datos y paridad distribuidos entre discos |\n| 6 | Datos y doble paridad distribuidos |\n| 10 | Bloques repartidos entre pares de discos en espejo |\n\nRAID 0 pierde el conjunto si falla un disco. RAID 5 y 6 tienen un coste de escritura por calcular paridad. El proceso de reconstrucción puede degradar el rendimiento y el fallo de otro disco puede superar la tolerancia del nivel. RAID se puede implementar por hardware o software; *hot-swap* permite sustituir una unidad en funcionamiento cuando la plataforma lo admite.\n\n### Ejemplo de cálculo (complementario)\n\nCon 4 discos de 4 TB:\n\n| Nivel | Capacidad útil teórica |\n|---|---:|\n| RAID 0 | 16 TB |\n| RAID 1 (solo pareja de 2 discos) | 4 TB |\n| RAID 5 | 12 TB |\n| RAID 6 | 8 TB |\n| RAID 10 | 8 TB |\n\n> [!WARNING]\n> RAID no sustituye a un backup: no protege por sí solo frente a borrados, ransomware, corrupción, incendio o pérdida del equipo completo.\n\n---\n\n## 3. NAS y casos de uso\n\nReferencia: PDF, páginas 10–12.\n\n### 3.1. NAS\n\nNetwork Attached Storage: dispositivo dedicado a almacenamiento accesible por red. Normalmente tiene varias bahías de disco, RAID, cuentas, permisos, carpetas compartidas y servicios de copia de seguridad. Centraliza datos de una oficina o casa. Si se habilita acceso remoto hay que protegerlo adecuadamente.\n\n```mermaid\nflowchart LR\n A[PC 1] --> R[Red local]\n B[PC 2] --> R\n C[Servidor] --> R\n R --> N[NAS: RAID y permisos]\n N --> X[Copia independiente]\n style N fill:#CE1141,color:#fff\n```\n\n### 3.2. RAID 5 frente a RAID 10\n\n| Criterio | RAID 5 | RAID 10 |\n|---|---|---|\n| Capacidad | N − 1 discos | Mitad de los discos |\n| Escritura | Penalización de paridad | Habitualmente mejor |\n| Reconstrucción | Lee los discos restantes | Copia desde el espejo superviviente |\n| Fallos | Uno | Uno por espejo, no ambos del mismo |\n| Uso | Archivos y capacidad | Bases de datos, alta carga de escritura |\n\nPara un NAS de archivos puede interesar RAID 5 por capacidad; para una base de datos con muchas escrituras, RAID 10 puede ser mejor. La decisión depende de rendimiento, riesgo, presupuesto y copias.\n\n---\n\n## 4. Ampliación y actualización\n\nReferencia: PDF, páginas 13–14.\n\n### Almacenamiento por capas (tiering)\n\nLos SSD NVMe PCIe 4.0/5.0 ofrecen varios GB/s, útiles en vídeo, bases de datos y tareas intensivas de E/S. El *tiering* distribuye los datos según su frecuencia de acceso, de manera automatizada cuando el sistema lo admite.\n\n| Capa | Datos | Tecnología típica |\n|---|---|---|\n| Caliente | Acceso frecuente | NVMe |\n| Templada | Acceso intermedio | SSD SATA |\n| Fría | Archivo | HDD |\n\n### SDS y nube\n\nEl almacenamiento definido por software (SDS) abstrae los discos físicos y gestiona capacidad, escalado y redundancia de forma flexible. Reduce dependencia de cabinas propietarias.\n\nEn la nube se contrata almacenamiento como servicio, con pago por uso y posibilidades de escalado y redundancia según configuración: objetos (p. ej., S3), bloques para discos virtuales y archivos compartidos. La nube híbrida puede combinar NAS local y almacenamiento cloud para copias o crecimiento.\n\n---\n\n## 5. Conceptos clave\n\n| Concepto | Definición rápida |\n|---|---|\n| HDD | Disco magnético mecánico. |\n| SSD | Unidad de estado sólido. |\n| NAND | Memoria flash no volátil. |\n| RPM | Revoluciones por minuto. |\n| TRIM | Informa al SSD de bloques no utilizados. |\n| Fragmentación | Dispersión de archivos en bloques. |\n| Striping | Reparto de bloques entre discos. |\n| Mirroring | Duplicación de datos en espejo. |\n| Paridad | Información que ayuda a reconstruir datos. |\n| RAID | Conjunto de discos para rendimiento o redundancia. |\n| Hot-swap | Sustitución en funcionamiento compatible. |\n| NAS | Almacenamiento conectado a la red. |\n| Tiering | Almacenamiento por capas según uso. |\n| SDS | Almacenamiento definido por software. |\n\n---\n\n## 6. Preguntas de repaso\n\nIntenta responder antes de desplegar la solución.\n\n<details>\n<summary>01. ¿Qué distingue almacenamiento secundario de RAM?<\/summary>\n\nConserva los datos sin corriente.\n\n<\/details>\n\n<details>\n<summary>02. ¿Cómo guarda información un HDD?<\/summary>\n\nMagnéticamente en platos giratorios.\n\n<\/details>\n\n<details>\n<summary>03. ¿Qué significan RPM?<\/summary>\n\nRevoluciones por minuto.\n\n<\/details>\n\n<details>\n<summary>04. ¿Qué tecnología utiliza un SSD?<\/summary>\n\nMemoria flash NAND.\n\n<\/details>\n\n<details>\n<summary>05. ¿Qué soporte suele ofrecer mejor coste por TB?<\/summary>\n\nHDD.\n\n<\/details>\n\n<details>\n<summary>06. ¿Qué soporte conviene para el sistema?<\/summary>\n\nSSD, preferiblemente NVMe compatible.\n\n<\/details>\n\n<details>\n<summary>07. ¿M.2 garantiza NVMe?<\/summary>\n\nNo; puede ser SATA o PCIe/NVMe.\n\n<\/details>\n\n<details>\n<summary>08. ¿Qué es la fragmentación?<\/summary>\n\nDispersión de bloques de un archivo.\n\n<\/details>\n\n<details>\n<summary>09. ¿Por qué desfragmentar un HDD?<\/summary>\n\nReduce desplazamientos del cabezal.\n\n<\/details>\n\n<details>\n<summary>10. ¿Qué hace TRIM?<\/summary>\n\nInforma al SSD de bloques ya libres.\n\n<\/details>\n\n<details>\n<summary>11. ¿Qué comando se menciona en Linux para TRIM?<\/summary>\n\nfstrim.\n\n<\/details>\n\n<details>\n<summary>12. ¿Qué interfaz ofrece funciones como doble puerto en servidores?<\/summary>\n\nSAS.\n\n<\/details>\n\n<details>\n<summary>13. ¿Qué significa RAID?<\/summary>\n\nRedundant Array of Independent Disks.\n\n<\/details>\n\n<details>\n<summary>14. ¿Qué hace RAID 0?<\/summary>\n\nReparte datos sin redundancia.\n\n<\/details>\n\n<details>\n<summary>15. ¿Qué hace RAID 1?<\/summary>\n\nDuplica datos en espejo.\n\n<\/details>\n\n<details>\n<summary>16. ¿Cuántos discos necesita RAID 5 como mínimo?<\/summary>\n\nTres.\n\n<\/details>\n\n<details>\n<summary>17. ¿Cuántos fallos tolera RAID 6?<\/summary>\n\nDos discos.\n\n<\/details>\n\n<details>\n<summary>18. ¿Cuántos discos necesita RAID 10?<\/summary>\n\nAl menos cuatro, en número par.\n\n<\/details>\n\n<details>\n<summary>19. ¿Cuál es el riesgo de perder ambos discos de un espejo RAID 10?<\/summary>\n\nSe pierde el conjunto si no puede reconstruirse ese espejo.\n\n<\/details>\n\n<details>\n<summary>20. ¿Cuánto ofrece RAID 5 con 4 discos de 4 TB?<\/summary>\n\n12 TB teóricos.\n\n<\/details>\n\n<details>\n<summary>21. ¿Cuánto ofrece RAID 6 con 4 discos de 4 TB?<\/summary>\n\n8 TB teóricos.\n\n<\/details>\n\n<details>\n<summary>22. ¿Cuánto ofrece RAID 10 con 4 discos de 4 TB?<\/summary>\n\n8 TB teóricos.\n\n<\/details>\n\n<details>\n<summary>23. ¿RAID sustituye a una copia de seguridad?<\/summary>\n\nNo.\n\n<\/details>\n\n<details>\n<summary>24. ¿Qué diferencia RAID 5 y RAID 10 en escritura?<\/summary>\n\nRAID 10 suele rendir mejor y no calcula paridad.\n\n<\/details>\n\n<details>\n<summary>25. ¿Qué es NAS?<\/summary>\n\nUn dispositivo que centraliza y comparte almacenamiento en red.\n\n<\/details>\n\n<details>\n<summary>26. ¿Qué es tiering?<\/summary>\n\nDistribuir datos entre capas rápidas y económicas según uso.\n\n<\/details>\n\n<details>\n<summary>27. ¿Qué es SDS?<\/summary>\n\nGestionar almacenamiento mediante software abstraído del hardware.\n\n<\/details>\n\n---\n\n## 7. Práctica\n\n- [ ] Elegir SSD para sistema y HDD para datos según un caso.\n- [ ] Elaborar tabla de RAID 0, 1, 5, 6 y 10 con capacidades y tolerancia.\n- [ ] Configurar RAID 1 por software en discos virtuales de prueba y comprobar su estado; no usar discos con datos reales.\n- [ ] Justificar RAID 5 frente a RAID 10 en un servidor.\n- [ ] Diseñar carpetas y permisos de un NAS y su copia independiente.\n\n**Entregable:** comparativa RAID y evidencia de RAID 1 por software.\n\n---\n\n## Resumen final\n\nHDD ofrece capacidad económica y SSD mayor velocidad. M.2 no equivale a NVMe. El HDD se desfragmenta cuando corresponde y el SSD se optimiza con TRIM. RAID mejora capacidad, rendimiento o tolerancia según nivel, pero no sustituye backups. NAS centraliza archivos. Tiering, SDS y almacenamiento en nube amplían las opciones.\n\n---\n\nFuente: Fundamentos de Hardware, Unidad 6. Prometeo - thePower. Apuntes personales. Los ejemplos y matices identificados como complementarios son material de apoyo.\n\n<div align=\"center\">\n\n`UNIDAD 06 | FUNDAMENTOS DE HARDWARE`\n\n[Volver al temario](../README.md)\n\n<\/div>\n", "questions": [["¿Qué distingue almacenamiento secundario de RAM?", "Conserva los datos sin corriente."], ["¿Cómo guarda información un HDD?", "Magnéticamente en platos giratorios."], ["¿Qué significan RPM?", "Revoluciones por minuto."], ["¿Qué tecnología utiliza un SSD?", "Memoria flash NAND."], ["¿Qué soporte suele ofrecer mejor coste por TB?", "HDD."], ["¿Qué soporte conviene para el sistema?", "SSD, preferiblemente NVMe compatible."], ["¿M.2 garantiza NVMe?", "No; puede ser SATA o PCIe/NVMe."], ["¿Qué es la fragmentación?", "Dispersión de bloques de un archivo."], ["¿Por qué desfragmentar un HDD?", "Reduce desplazamientos del cabezal."], ["¿Qué hace TRIM?", "Informa al SSD de bloques ya libres."], ["¿Qué comando se menciona en Linux para TRIM?", "fstrim."], ["¿Qué interfaz ofrece funciones como doble puerto en servidores?", "SAS."], ["¿Qué significa RAID?", "Redundant Array of Independent Disks."], ["¿Qué hace RAID 0?", "Reparte datos sin redundancia."], ["¿Qué hace RAID 1?", "Duplica datos en espejo."], ["¿Cuántos discos necesita RAID 5 como mínimo?", "Tres."], ["¿Cuántos fallos tolera RAID 6?", "Dos discos."], ["¿Cuántos discos necesita RAID 10?", "Al menos cuatro, en número par."], ["¿Cuál es el riesgo de perder ambos discos de un espejo RAID 10?", "Se pierde el conjunto si no puede reconstruirse ese espejo."], ["¿Cuánto ofrece RAID 5 con 4 discos de 4 TB?", "12 TB teóricos."], ["¿Cuánto ofrece RAID 6 con 4 discos de 4 TB?", "8 TB teóricos."], ["¿Cuánto ofrece RAID 10 con 4 discos de 4 TB?", "8 TB teóricos."], ["¿RAID sustituye a una copia de seguridad?", "No."], ["¿Qué diferencia RAID 5 y RAID 10 en escritura?", "RAID 10 suele rendir mejor y no calcula paridad."], ["¿Qué es NAS?", "Un dispositivo que centraliza y comparte almacenamiento en red."], ["¿Qué es tiering?", "Distribuir datos entre capas rápidas y económicas según uso."], ["¿Qué es SDS?", "Gestionar almacenamiento mediante software abstraído del hardware."]], "summary": "HDD ofrece capacidad económica y SSD mayor velocidad. M.2 no equivale a NVMe. El HDD se desfragmenta cuando corresponde y el SSD se optimiza con TRIM. RAID mejora capacidad, rendimiento o tolerancia según nivel, pero no sustituye backups. NAS centraliza archivos. Tiering, SDS y almacenamiento en nube amplían las opciones."}, "7": {"title": "Implantación de sistemas informáticos (CPD)", "markdown": "<div align=\"center\">\n\n<img src=\"https://readme-typing-svg.demolab.com?font=JetBrains+Mono&weight=700&size=30&color=FF334F&center=true&vCenter=true&width=650&height=60&repeat=false&lines=UNIDAD+07\" alt=\"Unidad 07\" />\n\n# Implantación de sistemas informáticos (CPD)\n\n`Fundamentos de Hardware | ASIR`\n\n<img src=\"https://img.shields.io/badge/ASIR-HARDWARE-CE1141?style=for-the-badge&labelColor=202020\" />\n\n<\/div>\n\n---\n\n[← Volver al temario](../README.md) · [Hardware Lab](../index.html)\n\n## Índice\n\n- [1. Arquitecturas de sistemas informáticos](#1-arquitecturas-de-sistemas-informáticos)\n- [2. El centro de procesamiento de datos (CPD)](#2-el-centro-de-procesamiento-de-datos-cpd)\n- [3. Refrigeración, seguridad y gestión de activos](#3-refrigeración-seguridad-y-gestión-de-activos)\n- [4. Ampliación y actualización](#4-ampliación-y-actualización)\n- [5. Conceptos clave](#5-conceptos-clave)\n- [6. Preguntas de repaso](#6-preguntas-de-repaso)\n- [7. Práctica](#7-práctica)\n\n---\n\n## 1. Arquitecturas de sistemas informáticos\n\nReferencia: PDF, páginas 4–7.\n\n| Sistema | Características | Uso |\n|---|---|---|\n| PC | Equipo de un usuario, tareas interactivas | Sobremesa, portátil, ofimática |\n| Servidor en torre | Similar a un PC grande, no requiere rack | Pymes con pocos servidores |\n| Servidor en rack | Formato plano normalizado, alta densidad | CPD, servicios a muchos usuarios |\n| Mainframe | Gran capacidad de E/S, transacciones y fiabilidad | Banca, seguros, aerolíneas, administración |\n\nLos sistemas departamentales prestan servicios a varios usuarios: correo, web, bases de datos y archivos. Pueden disponer de varios procesadores, RAM ECC, RAID hot-swap y fuentes redundantes. Se diseñan para disponibilidad continua; un PC potente no aporta automáticamente esas características. Los mainframes siguen teniendo utilidad en cargas transaccionales críticas y masivas.\n\n```mermaid\nflowchart LR\n A[PC: usuario] --> B[Servidor: organización]\n B --> C[Mainframe: transacciones críticas]\n style B fill:#CE1141,color:#fff\n```\n\n## 2. El centro de procesamiento de datos (CPD)\n\nReferencia: PDF, páginas 7–9.\n\n### 2.1. Diseño físico\n\nUn CPD es una instalación controlada que aloja servidores, almacenamiento y comunicaciones. Su diseño busca continuidad, seguridad, escalabilidad y facilidad de mantenimiento.\n\n| Elemento | Función |\n|---|---|\n| Ubicación protegida | Reduce inundaciones y accesos no autorizados |\n| Suelo técnico elevado (cuando se usa) | Canaliza cables o aire |\n| Doble acometida / distribución redundante | Evita depender de una única ruta eléctrica |\n| SAI | Mantiene carga temporalmente ante cortes |\n| Grupo electrógeno | Suministro prolongado durante cortes |\n| Refrigeración redundante | Mantiene temperatura de operación |\n| Comunicaciones redundantes | Mantienen conectividad ante fallos |\n| Pasillos frío/caliente | Separan entrada de aire frío y salida de aire caliente |\n\n```mermaid\nflowchart TD\n A[Red eléctrica] --> S[SAI / distribución]\n G[Generador de respaldo] --> S\n S --> R[Racks: servidores, red y discos]\n C[Refrigeración] --> R\n N[Comunicaciones] <--> R\n style R fill:#CE1141,color:#fff\n```\n\n### 2.2. Racks de 19 pulgadas\n\nArmarios estandarizados para montar equipos mediante guías. La altura se expresa en unidades U; un rack típico tiene 42U. Un servidor puede ocupar 1U, 2U o más. Complemento: 1U = 44,45 mm de altura nominal; 19 pulgadas se refiere al montaje, no al ancho exterior total.\n\n| Accesorio | Función |\n|---|---|\n| Guías | Sostener y extraer equipos compatibles |\n| PDU (Power Distribution Unit) | Distribuir alimentación a los equipos |\n| Patch panel | Terminar y organizar conexiones de red |\n| Organizadores | Guiar cables vertical u horizontalmente |\n| Paneles ciegos | Cubrir huecos y ayudar al flujo de aire |\n\nEjemplo complementario: 12 servidores de 2U, dos switches de 1U y almacenamiento de 4U ocupan 30U de 42U, quedan 12U antes de reservar espacio para otras piezas. Comprueba también peso, profundidad, potencia y refrigeración.\n\n### 2.3. Cableado estructurado\n\n- Cobre y fibra óptica entre racks y hacia la red.\n- Patch panels para gestionar conexiones.\n- Etiquetado de ambos extremos y documentación de rutas.\n- Organizadores horizontales y verticales.\n\nEl orden evita obstrucciones de aire, facilita identificar averías, reduce tiempos de mantenimiento y permite ampliar la instalación.\n\n## 3. Refrigeración, seguridad y gestión de activos\n\nReferencia: PDF, páginas 9–13.\n\n### 3.1. Refrigeración del CPD y PUE\n\nEl aire frío entra por el frontal de los servidores y el caliente sale por detrás. Se organizan filas con pasillos fríos frente a frontales y pasillos calientes frente a traseras, evitando mezclar ambos flujos. Se utiliza climatización de precisión, líquida o por inmersión en instalaciones de alta densidad.\n\n```mermaid\nflowchart LR\n F[Pasillo frío] --> R[Rack: frontal a trasera]\n R --> H[Pasillo caliente]\n H --> C[Climatización]\n C --> F\n style F fill:#245CA6,color:#fff\n style H fill:#CE1141,color:#fff\n```\n\nPUE (Power Usage Effectiveness) es el cociente entre la energía total del CPD y la energía consumida por el equipamiento informático en el mismo periodo.\n\n    PUE = energía total del CPD / energía de TI\n\n| Valor | Interpretación del temario |\n|---|---|\n| 1,0 | Ideal teórico: todo el consumo es TI |\n| 1,2–1,5 | Eficiente según referencia del PDF |\n| Más de 2 | Elevado consumo auxiliar respecto a TI |\n\nEjemplo: 150 kWh totales y 100 kWh de TI → PUE = 1,5; 50 kWh corresponden a sistemas auxiliares como refrigeración y distribución eléctrica. PUE no mide directamente huella de carbono ni eficiencia del software.\n\n### 3.2. Seguridad física y lógica\n\n| Seguridad física | Seguridad lógica |\n|---|---|\n| Tarjetas, biometría, control de visitas | Control de accesos y permisos |\n| Videovigilancia e intrusiones | Cortafuegos |\n| Detección y extinción de incendios apropiada | Cifrado y copias de seguridad |\n| Protección ante inundaciones | Parches y actualizaciones |\n\nAmbas se complementan. El temario relaciona estas medidas con protección de datos y ENS (Esquema Nacional de Seguridad), según el ámbito de aplicación. No basta con proteger la red si cualquiera accede físicamente a un disco.\n\n### 3.3. Inventario y gestión de activos\n\n- Inventariar equipos, componentes, número de serie, ubicación, configuración, versiones y garantías.\n- Documentar cableado, configuración y dependencias.\n- Planificar mantenimiento, renovaciones, garantías, bajas y reciclaje RAEE.\n- Probar actualizaciones de firmware y software antes de desplegarlas; programar ventanas de mantenimiento.\n\nDCIM (Data Center Infrastructure Management) reúne herramientas para supervisar y gestionar infraestructura, energía, espacio y activos.\n\nEjemplo de ficha de servidor:\n\n| Campo | Ejemplo ficticio |\n|---|---|\n| Identificador | SRV-01 |\n| Rack y posición | R01, U10–U11 |\n| Formato | 2U |\n| CPU / RAM | 16 núcleos / 128 GB ECC |\n| Almacenamiento | RAID 10 |\n| Alimentación | Fuentes redundantes |\n| Garantía y firmware | Registrar fechas y versiones reales |\n\n### 3.4. Inventario de software y licencias\n\nSe registra programa, versión, equipo, fecha de instalación, tipo de licencia (perpetua o suscripción; por usuario o dispositivo; ligada a la máquina o independiente), renovación y cantidad contratada frente a utilizada. Sirve para demostrar cumplimiento, detectar aplicaciones no autorizadas y desactualizadas, gestionar costes y renovaciones.\n\nEn Windows se consulta la información de programas instalados del registro o herramientas de inventario. Evita la clase WMI `Win32_Product`, que puede activar comprobaciones de los instaladores y ralentizar el sistema. En Linux se consultan paquetes con `dpkg -l` (Debian y derivados) o `rpm -qa` (sistemas RPM). En parques grandes, agentes de inventario recopilan datos en una base central. Complemento: no guardar claves completas ni información sensible en repositorios públicos.\n\n| Programa | Versión | Equipo | Tipo | Renovación |\n|---|---|---|---|---|\n| Aplicación de ejemplo | 2.0 | SRV-01 | Suscripción por equipo | Registrar fecha |\n\n## 4. Ampliación y actualización\n\nReferencia: PDF, páginas 13–15.\n\n### Hiperconvergencia (HCI)\n\nIntegra cómputo, almacenamiento y red en nodos gestionados por software en lugar de sistemas separados. Simplifica la gestión y facilita el escalado añadiendo nodos; es habitual como base de nubes privadas.\n\n### Edge computing\n\nAcerca pequeños CPD a fábricas, tiendas, sensores IoT y antenas 5G para reducir latencia y tráfico. Complementa el CPD central con nodos distribuidos.\n\n### Sostenibilidad\n\n- *Free cooling*: aprovechar condiciones exteriores favorables para refrigerar.\n- Refrigeración líquida y temperaturas de operación adecuadas al equipo.\n- Energía renovable y elección de ubicaciones apropiadas.\n- Virtualización y consolidación: menos equipos físicos infrautilizados.\n- Reparación, reutilización y reciclaje RAEE.\n\nEl PUE ayuda a evaluar consumos auxiliares, pero la sostenibilidad incluye también origen de energía, vida útil y huella ambiental.\n\n---\n\n## 5. Conceptos clave\n\n| Concepto | Definición rápida |\n|---|---|\n| PC | Ordenador personal. |\n| Servidor | Equipo que presta servicios a otros. |\n| Mainframe | Sistema central de alta fiabilidad y E/S masiva. |\n| CPD | Centro de procesamiento de datos. |\n| Rack | Armario estandarizado para equipos. |\n| U | Unidad de altura de rack. |\n| PDU | Unidad de distribución eléctrica. |\n| SAI | Sistema de alimentación ininterrumpida. |\n| Patch panel | Panel de organización de conexiones. |\n| PUE | Energía total dividida por energía TI. |\n| DCIM | Gestión de infraestructura de centros de datos. |\n| ENS | Esquema Nacional de Seguridad. |\n| HCI | Infraestructura hiperconvergente. |\n| Edge | Cómputo cerca del dato. |\n| Free cooling | Refrigeración aprovechando condiciones exteriores. |\n| RAEE | Residuos eléctricos y electrónicos. |\n\n---\n\n## 6. Preguntas de repaso\n\nIntenta responder antes de desplegar la solución.\n\n<details>\n<summary>01. ¿Para qué se usa un PC?<\/summary>\n\nPara tareas interactivas de un usuario.\n\n<\/details>\n\n<details>\n<summary>02. ¿Qué diferencia torre y rack?<\/summary>\n\nEl rack tiene formato normalizado para apilar equipos en armarios.\n\n<\/details>\n\n<details>\n<summary>03. ¿Qué caracteriza a un mainframe?<\/summary>\n\nFiabilidad y procesamiento masivo de transacciones y E/S.\n\n<\/details>\n\n<details>\n<summary>04. ¿Qué ventajas tiene un servidor frente a un PC para servicios críticos?<\/summary>\n\nECC, redundancia, RAID y disponibilidad según plataforma.\n\n<\/details>\n\n<details>\n<summary>05. ¿Qué es un CPD?<\/summary>\n\nUna instalación controlada para servidores, almacenamiento y comunicaciones.\n\n<\/details>\n\n<details>\n<summary>06. ¿Por qué proteger su ubicación?<\/summary>\n\nPara reducir riesgos de inundación e intrusión.\n\n<\/details>\n\n<details>\n<summary>07. ¿Qué aporta la alimentación redundante?<\/summary>\n\nRutas alternativas ante un fallo eléctrico.\n\n<\/details>\n\n<details>\n<summary>08. ¿Qué diferencia SAI y generador?<\/summary>\n\nEl SAI mantiene carga temporal y el generador aporta energía prolongada.\n\n<\/details>\n\n<details>\n<summary>09. ¿Qué ancho de montaje tiene el rack habitual?<\/summary>\n\n19 pulgadas.\n\n<\/details>\n\n<details>\n<summary>10. ¿Qué significa U?<\/summary>\n\nUnidad de altura; 44,45 mm nominales.\n\n<\/details>\n\n<details>\n<summary>11. ¿Cuántas U ocupa un servidor 2U?<\/summary>\n\nDos.\n\n<\/details>\n\n<details>\n<summary>12. ¿Qué es una PDU?<\/summary>\n\nUna unidad de distribución eléctrica.\n\n<\/details>\n\n<details>\n<summary>13. ¿Qué función tiene un patch panel?<\/summary>\n\nOrganizar y terminar conexiones de red.\n\n<\/details>\n\n<details>\n<summary>14. ¿Por qué etiquetar cables?<\/summary>\n\nPara localizar conexiones, mantener y ampliar con facilidad.\n\n<\/details>\n\n<details>\n<summary>15. ¿Cómo funcionan los pasillos frío/caliente?<\/summary>\n\nSeparan entrada de aire frío y salida de aire caliente.\n\n<\/details>\n\n<details>\n<summary>16. ¿Qué mide PUE?<\/summary>\n\nLa relación entre energía total y energía de TI.\n\n<\/details>\n\n<details>\n<summary>17. ¿Qué PUE corresponde a 150 kWh totales y 100 kWh de TI?<\/summary>\n\n1,5.\n\n<\/details>\n\n<details>\n<summary>18. ¿Qué PUE es ideal?<\/summary>\n\n1,0 teórico.\n\n<\/details>\n\n<details>\n<summary>19. ¿Qué medidas son físicas?<\/summary>\n\nControl de acceso, videovigilancia, extinción e inundaciones.\n\n<\/details>\n\n<details>\n<summary>20. ¿Qué medidas son lógicas?<\/summary>\n\nPermisos, cifrado, cortafuegos, copias y parches.\n\n<\/details>\n\n<details>\n<summary>21. ¿Qué es DCIM?<\/summary>\n\nGestión de infraestructura y activos del CPD.\n\n<\/details>\n\n<details>\n<summary>22. ¿Por qué probar actualizaciones antes de aplicarlas?<\/summary>\n\nPara reducir fallos e interrupciones de servicio.\n\n<\/details>\n\n<details>\n<summary>23. ¿Qué datos se registran en un inventario de software?<\/summary>\n\nPrograma, versión, equipo, fecha y licencia/renovación.\n\n<\/details>\n\n<details>\n<summary>24. ¿Qué es HCI?<\/summary>\n\nIntegrar cómputo, almacenamiento y red gestionados por software.\n\n<\/details>\n\n<details>\n<summary>25. ¿Qué aporta edge computing?<\/summary>\n\nMenor latencia y tráfico al procesar cerca del dato.\n\n<\/details>\n\n<details>\n<summary>26. ¿Qué es free cooling?<\/summary>\n\nRefrigeración aprovechando condiciones exteriores favorables.\n\n<\/details>\n\n<details>\n<summary>27. ¿Cómo ayuda la consolidación a la sostenibilidad?<\/summary>\n\nReduce servidores físicos infrautilizados y consumo.\n\n<\/details>\n\n---\n\n## 7. Práctica\n\n- [ ] Dibujar un CPD con racks, pasillos y alimentación redundante.\n- [ ] Distribuir el equipamiento en un rack de 42U.\n- [ ] Calcular el PUE y plantear mejoras.\n- [ ] Elaborar una ficha de servidor y un inventario de licencias.\n- [ ] Definir medidas físicas y lógicas y gestión de actualizaciones.\n\n**Entregable:** plano del CPD, cálculo PUE y ficha de servidor.\n\n---\n\n## Resumen final\n\nEl CPD aloja servicios críticos y requiere energía, refrigeración, comunicaciones y seguridad fiables. Los racks normalizan el montaje; el cableado ordenado facilita mantenimiento y flujo de aire. El PUE mide energía total frente a TI. Inventario, licencias y actualizaciones permiten administrar activos. HCI, edge y eficiencia energética amplían el diseño tradicional.\n\n---\n\nFuente: Fundamentos de Hardware, Unidad 7. Prometeo - thePower. Apuntes personales. Los ejemplos y matices identificados como complementarios son material de apoyo.\n\n<div align=\"center\">\n\n`UNIDAD 07 | FUNDAMENTOS DE HARDWARE`\n\n[Volver al temario](../README.md)\n\n<\/div>\n", "questions": [["¿Para qué se usa un PC?", "Para tareas interactivas de un usuario."], ["¿Qué diferencia torre y rack?", "El rack tiene formato normalizado para apilar equipos en armarios."], ["¿Qué caracteriza a un mainframe?", "Fiabilidad y procesamiento masivo de transacciones y E/S."], ["¿Qué ventajas tiene un servidor frente a un PC para servicios críticos?", "ECC, redundancia, RAID y disponibilidad según plataforma."], ["¿Qué es un CPD?", "Una instalación controlada para servidores, almacenamiento y comunicaciones."], ["¿Por qué proteger su ubicación?", "Para reducir riesgos de inundación e intrusión."], ["¿Qué aporta la alimentación redundante?", "Rutas alternativas ante un fallo eléctrico."], ["¿Qué diferencia SAI y generador?", "El SAI mantiene carga temporal y el generador aporta energía prolongada."], ["¿Qué ancho de montaje tiene el rack habitual?", "19 pulgadas."], ["¿Qué significa U?", "Unidad de altura; 44,45 mm nominales."], ["¿Cuántas U ocupa un servidor 2U?", "Dos."], ["¿Qué es una PDU?", "Una unidad de distribución eléctrica."], ["¿Qué función tiene un patch panel?", "Organizar y terminar conexiones de red."], ["¿Por qué etiquetar cables?", "Para localizar conexiones, mantener y ampliar con facilidad."], ["¿Cómo funcionan los pasillos frío/caliente?", "Separan entrada de aire frío y salida de aire caliente."], ["¿Qué mide PUE?", "La relación entre energía total y energía de TI."], ["¿Qué PUE corresponde a 150 kWh totales y 100 kWh de TI?", "1,5."], ["¿Qué PUE es ideal?", "1,0 teórico."], ["¿Qué medidas son físicas?", "Control de acceso, videovigilancia, extinción e inundaciones."], ["¿Qué medidas son lógicas?", "Permisos, cifrado, cortafuegos, copias y parches."], ["¿Qué es DCIM?", "Gestión de infraestructura y activos del CPD."], ["¿Por qué probar actualizaciones antes de aplicarlas?", "Para reducir fallos e interrupciones de servicio."], ["¿Qué datos se registran en un inventario de software?", "Programa, versión, equipo, fecha y licencia/renovación."], ["¿Qué es HCI?", "Integrar cómputo, almacenamiento y red gestionados por software."], ["¿Qué aporta edge computing?", "Menor latencia y tráfico al procesar cerca del dato."], ["¿Qué es free cooling?", "Refrigeración aprovechando condiciones exteriores favorables."], ["¿Cómo ayuda la consolidación a la sostenibilidad?", "Reduce servidores físicos infrautilizados y consumo."]], "summary": "El CPD aloja servicios críticos y requiere energía, refrigeración, comunicaciones y seguridad fiables. Los racks normalizan el montaje; el cableado ordenado facilita mantenimiento y flujo de aire. El PUE mide energía total frente a TI. Inventario, licencias y actualizaciones permiten administrar activos. HCI, edge y eficiencia energética amplían el diseño tradicional."}, "8": {"title": "Estándares y arquitectura en la computación en la nube", "markdown": "<div align=\"center\">\n\n<img src=\"https://readme-typing-svg.demolab.com?font=JetBrains+Mono&weight=700&size=30&color=FF334F&center=true&vCenter=true&width=650&height=60&repeat=false&lines=UNIDAD+08\" alt=\"Unidad 08\" />\n\n# Estándares y arquitectura en la computación en la nube\n\n`Fundamentos de Hardware | ASIR`\n\n<img src=\"https://img.shields.io/badge/ASIR-HARDWARE-CE1141?style=for-the-badge&labelColor=202020\" />\n\n<\/div>\n\n---\n\n[← Volver al temario](../README.md) · [Hardware Lab](../index.html)\n\n## Índice\n\n- [1. Fundamentos del cloud computing](#1-fundamentos-del-cloud-computing)\n- [2. Modelos de servicio y proveedores](#2-modelos-de-servicio-y-proveedores)\n- [3. Arquitectura cloud, migración y tendencias](#3-arquitectura-cloud-migración-y-tendencias)\n- [4. Ampliación y actualización](#4-ampliación-y-actualización)\n- [5. Conceptos clave](#5-conceptos-clave)\n- [6. Preguntas de repaso](#6-preguntas-de-repaso)\n- [7. Práctica](#7-práctica)\n\n---\n\n## 1. Fundamentos del cloud computing\n\nReferencia: PDF, páginas 4–7.\n\nLa computación en la nube consiste en consumir recursos informáticos (cómputo, almacenamiento, redes, aplicaciones) como servicios accesibles por red, normalmente internet. El hardware físico sigue existiendo en los CPD del proveedor.\n\n### 1.1. Evolución histórica\n\n```mermaid\nflowchart LR\n A[CPD propio] --> B[Virtualización]\n B --> C[Infraestructura bajo demanda]\n C --> D[Servicios cloud]\n style C fill:#CE1141,color:#fff\n```\n\nLa virtualización aprovecha mejor el hardware al ejecutar varias máquinas virtuales en un mismo servidor. La nube añade aprovisionamiento bajo demanda, flexibilidad y un modelo de consumo de servicios.\n\n### 1.2. Ventajas e inconvenientes\n\n| Ventaja | Inconveniente o condición |\n|---|---|\n| Pago por uso y menor inversión inicial | Costes recurrentes que pueden crecer si no se controlan |\n| Escalabilidad y elasticidad | La aplicación debe poder aprovecharlas |\n| Gestión física por el proveedor | Dependencia del proveedor y de la conectividad |\n| Acceso global y redundancia geográfica | Hay que diseñar la disponibilidad y proteger datos |\n| Agilidad para crear recursos | Riesgos de cumplimiento y ubicación de datos |\n\nEscalabilidad: capacidad de soportar mayor carga aumentando recursos. Elasticidad: adaptar recursos a la demanda, aumentándolos o reduciéndolos. Ejemplo: una tienda aumenta recursos durante una campaña y vuelve a reducirlos después. La nube no es necesariamente más barata; se compara el coste a lo largo del tiempo.\n\n## 2. Modelos de servicio y proveedores\n\nReferencia: PDF, páginas 7–9; esquema de responsabilidades de la página 4.\n\n### 2.1. IaaS, PaaS y SaaS\n\n| Modelo | Qué ofrece | Qué gestiona el cliente | Ejemplo |\n|---|---|---|---|\n| IaaS (Infrastructure as a Service) | Infraestructura virtual: máquinas, discos, redes | SO, aplicaciones, datos y configuración | Instancia virtual |\n| PaaS (Platform as a Service) | Entorno gestionado para desarrollar y ejecutar aplicaciones | Código, datos y configuración de aplicación | Plataforma web gestionada |\n| SaaS (Software as a Service) | Aplicación lista para usar | Uso, cuentas, datos y configuración permitida | Correo u ofimática web |\n\n| Capa | On-premise | IaaS | PaaS | SaaS |\n|---|---|---|---|---|\n| Hardware, sala, energía y red física | Cliente | Proveedor | Proveedor | Proveedor |\n| Virtualización | Cliente | Proveedor | Proveedor | Proveedor |\n| Sistema operativo | Cliente | Cliente | Proveedor | Proveedor |\n| Entorno de ejecución | Cliente | Cliente | Proveedor | Proveedor |\n| Aplicación | Cliente | Cliente | Cliente | Proveedor |\n| Datos y accesos | Cliente | Cliente | Cliente | Cliente, con responsabilidades compartidas |\n\nLa tabla representa el modelo típico; el contrato y servicio concreto determinan las responsabilidades. IaaS da más control, PaaS reduce administración de infraestructura y SaaS simplifica el uso. Ninguno elimina la responsabilidad del cliente sobre sus cuentas y configuración.\n\n### 2.2. Proveedores\n\n| Proveedor | Rasgo destacado en el temario |\n|---|---|\n| AWS (Amazon Web Services) | Oferta amplia de infraestructura y servicios |\n| Microsoft Azure | Integración con ecosistema Microsoft y empresas |\n| Google Cloud (GCP) | Analítica, datos e inteligencia artificial |\n\n### Modelos de despliegue\n\n| Modelo | Definición | Motivo de elección |\n|---|---|---|\n| Pública | Infraestructura del proveedor compartida entre clientes con aislamiento lógico | Flexibilidad y escalado |\n| Privada | Infraestructura cloud dedicada a una organización, local o alojada | Control y cumplimiento |\n| Híbrida | Integra nube privada/local y pública | Combinar control con elasticidad |\n| Multinube | Uso de varios proveedores | Reducir dependencia o elegir servicios específicos |\n\nNo confundir modelo de servicio (IaaS/PaaS/SaaS) con modelo de despliegue (pública/privada/híbrida). La multinube puede añadir complejidad y no elimina automáticamente la dependencia.\n\n## 3. Arquitectura cloud, migración y tendencias\n\nReferencia: PDF, páginas 9–12.\n\n### 3.1. Arquitectura cloud\n\n- **Región:** zona geográfica que contiene infraestructura del proveedor.\n- **Zona de disponibilidad (AZ):** ubicación o conjunto de centros de datos dentro de una región, con aislamiento de fallos y alimentación y red independientes según diseño del proveedor.\n- **Servicios gestionados:** máquinas virtuales, contenedores, almacenamiento de objetos/bloques, bases de datos y redes virtuales (VPC).\n\n```mermaid\nflowchart TD\n U[Usuarios] --> L[Distribución de tráfico]\n L --> A[Región: zona A]\n L --> B[Región: zona B]\n A --> S[Servicio de datos replicado]\n B --> S\n style L fill:#CE1141,color:#fff\n style A fill:#971532,color:#fff\n style B fill:#971532,color:#fff\n```\n\nDistribuir una aplicación entre varias AZ reduce el riesgo de caída de una zona si la aplicación, datos y tráfico están diseñados para tolerarla. Una región y una zona no son lo mismo. También se consideran coste, latencia, residencia de datos y recuperación.\n\n### 3.2. Estrategias de migración\n\n| Estrategia | Qué hace | Equilibrio |\n|---|---|---|\n| Rehost (lift and shift) | Mover la aplicación casi tal cual a máquinas virtuales | Rápido, limitado aprovechamiento cloud |\n| Replatform | Ajustes menores y servicios gestionados | Intermedio |\n| Refactor | Rediseño de la aplicación (contenedores, serverless) | Mayor esfuerzo, potencial beneficio |\n| Recomprar (repurchase) | Sustituir por un SaaS equivalente | Depende del producto |\n| Retirar (retire) | Eliminar aplicaciones sin uso | Evita coste innecesario |\n\nMigrar por fases: inventariar y valorar dependencias, empezar con sistemas menos críticos, comprobar funcionamiento y costes, avanzar a los estratégicos. Complemento: mantener un plan de retorno y verificar los datos antes de retirar el sistema original.\n\n### 3.3. Edge y serverless\n\nEdge computing procesa datos cerca de donde se generan (IoT, fábricas, vehículos, cámaras, redes 5G). Reduce latencia y tráfico hacia el CPD central; complementa la nube.\n\nServerless ejecuta código sin que el cliente aprovisione ni mantenga servidores. El proveedor asigna recursos y escala según la carga. Las funciones bajo demanda son útiles para APIs y automatismos. El hardware existe: se abstrae su gestión. El coste depende del servicio, ejecuciones, duración y recursos; otros componentes pueden seguir generando cargos.\n\n## 4. Ampliación y actualización\n\nReferencia: PDF, páginas 12–14.\n\n### Contenedores y Kubernetes\n\n| Máquina virtual | Contenedor |\n|---|---|\n| Incluye sistema operativo invitado | Comparte núcleo compatible del anfitrión |\n| Aislamiento mediante hipervisor | Aislamiento a nivel de sistema operativo |\n| Habitualmente más pesada | Habitualmente más ligera y rápida de iniciar |\n\nDocker empaqueta aplicaciones y dependencias. Kubernetes orquesta contenedores a escala: despliega, distribuye, escala y reinicia cargas. La portabilidad facilita mover aplicaciones entre entornos compatibles; depende también de configuración, arquitectura y servicios externos.\n\n```mermaid\nflowchart TD\n K[Kubernetes: orquestación] --> A[Nodo 1]\n K --> B[Nodo 2]\n A --> C[Contenedores]\n B --> D[Contenedores]\n style K fill:#CE1141,color:#fff\n```\n\nEstas tecnologías permiten aplicaciones *cloud-native* y automatización reproducible. No garantizan alta disponibilidad sin configuración adecuada.\n\n### Comparación de costes (ejemplo complementario)\n\nSupongamos una instancia a 0,10 €/hora durante 200 horas: 20 € de cómputo. Añade almacenamiento, red, copias y otros servicios. Una reserva o compromiso puede reducir el precio si la carga es estable, pero limita flexibilidad. Para comparar con on-premise incluye adquisición, amortización, electricidad, refrigeración, mantenimiento y personal. Los números son ficticios y no representan precios de ningún proveedor.\n\n---\n\n## 5. Conceptos clave\n\n| Concepto | Definición rápida |\n|---|---|\n| Cloud | Recursos informáticos consumidos como servicio. |\n| On-premise | Infraestructura gestionada localmente. |\n| Elasticidad | Ajustar recursos a la demanda. |\n| IaaS | Infraestructura como servicio. |\n| PaaS | Plataforma como servicio. |\n| SaaS | Software como servicio. |\n| AWS | Amazon Web Services. |\n| Azure | Plataforma cloud de Microsoft. |\n| GCP | Google Cloud Platform. |\n| Nube híbrida | Combinación de nube privada/local y pública. |\n| Multinube | Uso de varios proveedores. |\n| Región | Área geográfica de infraestructura cloud. |\n| AZ | Zona de disponibilidad. |\n| VPC | Red virtual privada. |\n| Rehost | Migrar casi sin cambios. |\n| Replatform | Migrar con ajustes limitados. |\n| Refactor | Rediseñar para cloud. |\n| Serverless | Ejecutar código sin gestionar servidores. |\n| Contenedor | Aplicación empaquetada con dependencias. |\n| Kubernetes | Orquestador de contenedores. |\n\n---\n\n## 6. Preguntas de repaso\n\nIntenta responder antes de desplegar la solución.\n\n<details>\n<summary>01. ¿Qué es cloud computing?<\/summary>\n\nConsumir recursos informáticos como servicios por red.\n\n<\/details>\n\n<details>\n<summary>02. ¿Existen servidores físicos en la nube?<\/summary>\n\nSí, en los CPD del proveedor.\n\n<\/details>\n\n<details>\n<summary>03. ¿Cómo evolucionó el CPD hacia la nube?<\/summary>\n\nMediante virtualización e infraestructura bajo demanda.\n\n<\/details>\n\n<details>\n<summary>04. ¿Qué diferencia escalabilidad y elasticidad?<\/summary>\n\nEscalar permite soportar más carga; elasticidad ajusta recursos a la demanda.\n\n<\/details>\n\n<details>\n<summary>05. ¿La nube siempre es más barata?<\/summary>\n\nNo; depende del uso y coste total.\n\n<\/details>\n\n<details>\n<summary>06. ¿Qué es IaaS?<\/summary>\n\nInfraestructura virtual como servicio.\n\n<\/details>\n\n<details>\n<summary>07. ¿Quién administra el sistema operativo en IaaS?<\/summary>\n\nHabitualmente el cliente.\n\n<\/details>\n\n<details>\n<summary>08. ¿Qué es PaaS?<\/summary>\n\nPlataforma gestionada para desarrollar y desplegar aplicaciones.\n\n<\/details>\n\n<details>\n<summary>09. ¿Qué es SaaS?<\/summary>\n\nAplicación lista para utilizar como servicio.\n\n<\/details>\n\n<details>\n<summary>10. ¿Cuáles son los tres grandes proveedores citados?<\/summary>\n\nAWS, Azure y Google Cloud.\n\n<\/details>\n\n<details>\n<summary>11. ¿Qué es nube pública?<\/summary>\n\nRecursos del proveedor compartidos con aislamiento lógico.\n\n<\/details>\n\n<details>\n<summary>12. ¿Qué es nube privada?<\/summary>\n\nInfraestructura cloud dedicada a una organización.\n\n<\/details>\n\n<details>\n<summary>13. ¿Qué es nube híbrida?<\/summary>\n\nCombina nube privada/local y pública.\n\n<\/details>\n\n<details>\n<summary>14. ¿Qué es multinube?<\/summary>\n\nUso de varios proveedores.\n\n<\/details>\n\n<details>\n<summary>15. ¿Qué es una región?<\/summary>\n\nUna zona geográfica donde el proveedor ofrece infraestructura.\n\n<\/details>\n\n<details>\n<summary>16. ¿Qué es una AZ?<\/summary>\n\nZona de disponibilidad con aislamiento de fallos dentro de una región.\n\n<\/details>\n\n<details>\n<summary>17. ¿Por qué desplegar entre varias AZ?<\/summary>\n\nPara reducir interrupciones ante el fallo de una zona.\n\n<\/details>\n\n<details>\n<summary>18. ¿Qué es rehost?<\/summary>\n\nMover una aplicación casi tal cual.\n\n<\/details>\n\n<details>\n<summary>19. ¿Qué es replatform?<\/summary>\n\nMigrar con ajustes menores y servicios gestionados.\n\n<\/details>\n\n<details>\n<summary>20. ¿Qué es refactor?<\/summary>\n\nRediseñar una aplicación para aprovechar la nube.\n\n<\/details>\n\n<details>\n<summary>21. ¿Qué significa recomprar?<\/summary>\n\nSustituir una aplicación por un SaaS equivalente.\n\n<\/details>\n\n<details>\n<summary>22. ¿Qué es retirar en una migración?<\/summary>\n\nEliminar sistemas que ya no se usan.\n\n<\/details>\n\n<details>\n<summary>23. ¿Qué es edge computing?<\/summary>\n\nProcesamiento cercano al origen del dato.\n\n<\/details>\n\n<details>\n<summary>24. ¿Qué es serverless?<\/summary>\n\nEjecutar código sin administrar servidores.\n\n<\/details>\n\n<details>\n<summary>25. ¿Qué diferencia una VM de un contenedor?<\/summary>\n\nLa VM incluye un SO invitado; el contenedor comparte el núcleo compatible del anfitrión.\n\n<\/details>\n\n<details>\n<summary>26. ¿Para qué sirve Kubernetes?<\/summary>\n\nOrquestar, distribuir, reiniciar y escalar contenedores.\n\n<\/details>\n\n<details>\n<summary>27. ¿Cuánto cuesta una instancia ficticia de 0,10 €/h usada 200 h?<\/summary>\n\n20 € de cómputo, sin otros servicios.\n\n<\/details>\n\n---\n\n## 7. Práctica\n\n- [ ] Elegir IaaS, PaaS o SaaS para distintos casos.\n- [ ] Diseñar un servicio distribuido en dos zonas de disponibilidad.\n- [ ] Justificar una estrategia de migración por fases.\n- [ ] Comparar pago por uso, compromiso y on-premise.\n- [ ] Si se practica en una cuenta autorizada, crear una instancia de laboratorio, documentarla y eliminar los recursos cuando termine la práctica para evitar cargos. Comprobar antes precios y límites.\n\n**Entregable del temario:** evidencia de una instancia en ejecución, análisis de zonas y comparativa de costes.\n\n---\n\n## Resumen final\n\nLa nube consume infraestructura y aplicaciones como servicios. IaaS, PaaS y SaaS se distinguen por el reparto de responsabilidades. Pública, privada e híbrida son formas de despliegue. Regiones y AZ permiten diseñar disponibilidad. Rehost, replatform y refactor adaptan la migración a cada carga. Edge, serverless, contenedores y Kubernetes completan las tendencias del temario.\n\n---\n\nFuente: Fundamentos de Hardware, Unidad 8. Prometeo - thePower. Apuntes personales. Los ejemplos y matices identificados como complementarios son material de apoyo.\n\n<div align=\"center\">\n\n`UNIDAD 08 | FUNDAMENTOS DE HARDWARE`\n\n[Volver al temario](../README.md)\n\n<\/div>\n", "questions": [["¿Qué es cloud computing?", "Consumir recursos informáticos como servicios por red."], ["¿Existen servidores físicos en la nube?", "Sí, en los CPD del proveedor."], ["¿Cómo evolucionó el CPD hacia la nube?", "Mediante virtualización e infraestructura bajo demanda."], ["¿Qué diferencia escalabilidad y elasticidad?", "Escalar permite soportar más carga; elasticidad ajusta recursos a la demanda."], ["¿La nube siempre es más barata?", "No; depende del uso y coste total."], ["¿Qué es IaaS?", "Infraestructura virtual como servicio."], ["¿Quién administra el sistema operativo en IaaS?", "Habitualmente el cliente."], ["¿Qué es PaaS?", "Plataforma gestionada para desarrollar y desplegar aplicaciones."], ["¿Qué es SaaS?", "Aplicación lista para utilizar como servicio."], ["¿Cuáles son los tres grandes proveedores citados?", "AWS, Azure y Google Cloud."], ["¿Qué es nube pública?", "Recursos del proveedor compartidos con aislamiento lógico."], ["¿Qué es nube privada?", "Infraestructura cloud dedicada a una organización."], ["¿Qué es nube híbrida?", "Combina nube privada/local y pública."], ["¿Qué es multinube?", "Uso de varios proveedores."], ["¿Qué es una región?", "Una zona geográfica donde el proveedor ofrece infraestructura."], ["¿Qué es una AZ?", "Zona de disponibilidad con aislamiento de fallos dentro de una región."], ["¿Por qué desplegar entre varias AZ?", "Para reducir interrupciones ante el fallo de una zona."], ["¿Qué es rehost?", "Mover una aplicación casi tal cual."], ["¿Qué es replatform?", "Migrar con ajustes menores y servicios gestionados."], ["¿Qué es refactor?", "Rediseñar una aplicación para aprovechar la nube."], ["¿Qué significa recomprar?", "Sustituir una aplicación por un SaaS equivalente."], ["¿Qué es retirar en una migración?", "Eliminar sistemas que ya no se usan."], ["¿Qué es edge computing?", "Procesamiento cercano al origen del dato."], ["¿Qué es serverless?", "Ejecutar código sin administrar servidores."], ["¿Qué diferencia una VM de un contenedor?", "La VM incluye un SO invitado; el contenedor comparte el núcleo compatible del anfitrión."], ["¿Para qué sirve Kubernetes?", "Orquestar, distribuir, reiniciar y escalar contenedores."], ["¿Cuánto cuesta una instancia ficticia de 0,10 €/h usada 200 h?", "20 € de cómputo, sin otros servicios."]], "summary": "La nube consume infraestructura y aplicaciones como servicios. IaaS, PaaS y SaaS se distinguen por el reparto de responsabilidades. Pública, privada e híbrida son formas de despliegue. Regiones y AZ permiten diseñar disponibilidad. Rehost, replatform y refactor adaptan la migración a cada carga. Edge, serverless, contenedores y Kubernetes completan las tendencias del temario."}, "9": {"title": "Imágenes de respaldo de sistemas", "markdown": "<div align=\"center\">\n\n<img src=\"https://readme-typing-svg.demolab.com?font=JetBrains+Mono&weight=700&size=30&color=FF334F&center=true&vCenter=true&width=650&height=60&repeat=false&lines=UNIDAD+09\" alt=\"Unidad 09\" />\n\n# Imágenes de respaldo de sistemas\n\n`Fundamentos de Hardware | ASIR`\n\n<img src=\"https://img.shields.io/badge/ASIR-HARDWARE-CE1141?style=for-the-badge&labelColor=202020\" />\n\n<\/div>\n\n---\n\n[← Volver al temario](../README.md) · [Hardware Lab](../index.html)\n\n## Índice\n\n- [1. Imágenes de respaldo](#1-imágenes-de-respaldo)\n- [2. Migración de sistemas](#2-migración-de-sistemas)\n- [3. Mantenimiento y benchmarking](#3-mantenimiento-y-benchmarking)\n- [4. Ampliación y actualización](#4-ampliación-y-actualización)\n- [5. Conceptos clave](#5-conceptos-clave)\n- [6. Preguntas de repaso](#6-preguntas-de-repaso)\n- [7. Práctica](#7-práctica)\n\n---\n\n## 1. Imágenes de respaldo\n\nReferencia: PDF, páginas 4–8.\n\n### 1.1. Tipos de imagen\n\nUna imagen de sistema captura el contenido de un disco o partición para restaurarlo posteriormente: sistema operativo, aplicaciones, configuración y datos incluidos. Una copia de archivos protege archivos seleccionados; una imagen puede reconstruir el entorno completo.\n\n| Tipo | Qué captura | Uso |\n|---|---|---|\n| Imagen completa | Todo el disco o conjunto de particiones | Recuperación del sistema |\n| Imagen base | Sistema y programas preparados y configurados | Desplegar equipos iguales |\n| Sector a sector | Todos los sectores, incluso los libres | Copia exacta del soporte |\n| Inteligente | Bloques usados en sistemas compatibles | Reduce tiempo y tamaño |\n\nClonar puede significar copiar directamente de disco a disco, mientras que una imagen se guarda en un archivo o conjunto de archivos. El temario usa ambos conceptos para explicar la restauración y el despliegue.\n\n```mermaid\nflowchart LR\n A[Sistema configurado] --> B[Crear imagen]\n B --> C[Destino seguro y verificación]\n C --> D[Restaurar o desplegar]\n style B fill:#CE1141,color:#fff\n style D fill:#971532,color:#fff\n```\n\n### 1.2. Particionado de discos\n\nParticionar es dividir lógicamente un disco en secciones que el sistema trata como unidades diferenciadas. Permite separar sistema y datos, instalar varios sistemas operativos (dual boot) y reservar particiones EFI, recuperación o swap de Linux.\n\n| Característica | MBR | GPT |\n|---|---|---|\n| Tecnología | Tradicional | Moderna |\n| Capacidad | Límite típico de unos 2 TB con sectores de 512 bytes | Admite discos grandes |\n| Particiones | 4 primarias; una puede ser extendida | Muchas particiones |\n| Arranque asociado | BIOS clásica | UEFI habitual |\n\nSeparar datos y sistema facilita restaurar solo el sistema, pero **no sustituye una copia independiente**. Un fallo físico puede destruir todas las particiones. Para restaurar un arranque UEFI pueden ser necesarias varias particiones, no solo la del SO.\n\n### 1.3. Herramientas de creación de imágenes\n\n| Herramienta | Uso |\n|---|---|\n| Clonezilla | Libre y gratuito; imágenes, clonación y despliegue en red |\n| Copias de seguridad de Windows | Opciones de respaldo del sistema según versión |\n| dd (Linux) | Copia de bloques; requiere especial cuidado con origen y destino |\n| Acronis / Macrium | Soluciones comerciales de imagen y restauración |\n\n### Procedimiento de Clonezilla\n\n1. Preparar medio de arranque USB/CD y un destino seguro con espacio suficiente.\n2. Arrancar Clonezilla desde el medio.\n3. Elegir crear/restaurar imagen o clonar directamente, según necesidad.\n4. Identificar con precisión disco o partición de origen y destino.\n5. Crear la imagen, guardarla y verificar su integridad.\n6. Para restaurar, seleccionar la imagen y el disco de destino correctos, confirmar y ejecutar.\n7. Comprobar que el sistema restaurado arranca y los datos necesarios están disponibles.\n\n> [!WARNING]\n> Restaurar o clonar puede sobrescribir completamente el disco de destino. Practica primero con discos virtuales sin datos importantes y conserva una copia independiente.\n\nEl despliegue de una imagen base ahorra reinstalar y configurar cada equipo de un aula u oficina. Verifica compatibilidad de hardware, licencias e identidad de cada equipo.\n\n## 2. Migración de sistemas\n\nReferencia: PDF, páginas 8–10.\n\nMigrar consiste en trasladar un sistema a otro entorno conservando datos y configuración, evitando reinstalar desde cero cuando sea posible.\n\n| Tipo | Origen | Destino | Ejemplo |\n|---|---|---|---|\n| P2P | Físico | Físico | Renovar hardware |\n| P2V | Físico | Virtual | Consolidar servidores |\n| V2P | Virtual | Físico | Trasladar a hardware dedicado |\n| V2V | Virtual | Virtual | Cambiar de hipervisor o infraestructura |\n\n### 2.2. Proceso P2V\n\nHerramientas citadas: VMware vCenter Converter, Disk2VHD y herramientas del hipervisor. Comprobar compatibilidad y disponibilidad antes de elegir.\n\n```mermaid\nflowchart TD\n A[Servidor físico] --> B[Capturar y convertir discos]\n B --> C[Disco virtual]\n C --> D[Configurar VM y controladores]\n D --> E[Verificar arranque y servicios]\n E --> F[Retirar físico solo tras validar]\n style A fill:#CE1141,color:#fff\n style E fill:#971532,color:#fff\n```\n\nBeneficios: consolidación, movilidad, copias y snapshots. Un snapshot facilita volver a un estado previo, pero no equivale necesariamente a un backup independiente. Planifica parada o sincronización final para evitar inconsistencias en servicios activos.\n\n## 3. Mantenimiento y benchmarking\n\nReferencia: PDF, páginas 10–14.\n\n### 3.1. Tipos de mantenimiento\n\n| Preventivo | Correctivo |\n|---|---|\n| Antes de que falle el equipo | Después de una avería |\n| Limpieza, revisión, actualización, comprobación | Reparación, sustitución, restauración |\n| Reduce interrupciones y prolonga vida útil | Recupera el servicio |\n\nUn plan periódico evita pérdidas de datos y reduce costes frente a actuar solo cuando se produce un fallo. Se deben combinar prevención y corrección.\n\n### 3.2. Monitorización SMART\n\nSMART (Self-Monitoring, Analysis and Reporting Technology) es un sistema de autodiagnóstico de discos HDD y SSD. Puede detectar indicios de deterioro antes del fallo.\n\n| Parámetro | Qué indica |\n|---|---|\n| Sectores reasignados | Bloques defectuosos sustituidos por reservas |\n| Errores de lectura | Problemas al acceder a datos |\n| Horas de funcionamiento | Tiempo de uso |\n| Temperatura | Condiciones térmicas |\n| Desgaste SSD | Estimación de vida de escritura según fabricante |\n\nHerramientas: CrystalDiskInfo y `smartctl`. Los atributos y umbrales varían según el disco. Ante alertas o deterioro, protege datos y planifica sustitución. SMART no predice todos los fallos y un estado bueno no garantiza que no vaya a fallar.\n\n### 3.3. Diagnóstico y benchmarking\n\n| Diagnóstico | Benchmarking |\n|---|---|\n| Detecta fallos y problemas | Mide y compara rendimiento |\n| MemTest, pruebas de disco, temperatura y estabilidad | CrystalDiskMark (disco), Cinebench (CPU), 3DMark (GPU) |\n\nEl benchmark permite comparar antes y después de una mejora, detectar rendimiento inferior al esperado y comparar equipos. Para una comparación justa mantén condiciones, configuración, versión del programa y temperatura similares.\n\nEjemplo complementario: pasar de 100 a 500 MB/s significa multiplicar por 5 la tasa medida (aumento del 400 %); no implica que todo el equipo sea cinco veces más rápido.\n\n### 3.4. Recuperación de datos\n\nSe intenta rescatar información sin una copia previa disponible. En determinados sistemas de archivos, borrar marca el espacio como libre hasta que otra escritura lo sobrescriba. Con TRIM y SSD esto cambia drásticamente: la recuperación puede resultar imposible.\n\n```mermaid\nflowchart TD\n A[Pérdida de datos] --> B[Detener escrituras]\n B --> C{Fallo físico sospechado?}\n C -->|Sí| D[Laboratorio especializado]\n C -->|No| E[Clon seguro del soporte]\n E --> F[Recuperar desde la copia]\n F --> G[Guardar en otro disco y verificar]\n style B fill:#CE1141,color:#fff\n style G fill:#971532,color:#fff\n```\n\nHerramientas de recuperación pueden reconstruir particiones y sectores de arranque, recuperar archivos por firmas o clonar discos con errores. Trabajar sobre un clon y guardar lo recuperado en otro soporte. Ante ruido mecánico anómalo, daño electrónico o datos críticos, no insistir con pruebas que puedan agravar el daño; recurrir a profesionales.\n\n**La recuperación no está garantizada y no sustituye la prevención.**\n\n## 4. Ampliación y actualización\n\nReferencia: PDF, páginas 14–17.\n\n### PXE y despliegue en red\n\nPXE (Preboot Execution Environment) permite arrancar un equipo desde la red y cargar un entorno de instalación o recibir una imagen desde un servidor. Facilita desplegar sistemas a muchas máquinas (aulas, oficinas, CPD) sin usar un USB por equipo.\n\nEn entornos virtualizados y cloud se usan plantillas o imágenes maestras para lanzar instancias reproducibles. La infraestructura como código automatiza configuraciones y despliegues.\n\n### Ransomware y copias inmutables\n\nEl ransomware puede cifrar o borrar datos y también atacar sus copias de seguridad. Las copias inmutables utilizan mecanismos WORM (Write Once, Read Many) para impedir modificaciones o borrado durante un periodo de retención, según configuración y controles.\n\n| Regla 3-2-1 | Significado |\n|---|---|\n| 3 | Tres copias en total, contando el original |\n| 2 | Dos tipos de soportes o sistemas de almacenamiento |\n| 1 | Una copia fuera del sitio principal |\n\nAir gap: copia aislada de la red o desconectada para reducir exposición. Combinar 3-2-1, copias inmutables, aislamiento y pruebas periódicas de restauración mejora las posibilidades de recuperación, pero no garantiza el éxito absoluto.\n\n### Cálculo de tiempo de respaldo (complementario)\n\n    Tiempo ideal (s) = tamaño (MB) / velocidad efectiva (MB/s)\n\nEjemplo: 100 GB decimales = 100.000 MB. A 100 MB/s, tiempo ideal de 1.000 s (16 min 40 s). Compresión, archivos pequeños, latencia, red y verificación alteran el tiempo real.\n\n---\n\n## 5. Conceptos clave\n\n| Concepto | Definición rápida |\n|---|---|\n| Imagen | Copia de disco o partición restaurable. |\n| Clon | Copia directa de un soporte. |\n| Partición | División lógica del disco. |\n| MBR | Esquema tradicional de particiones. |\n| GPT | Esquema moderno de particiones. |\n| Clonezilla | Herramienta libre de imágenes y clonación. |\n| P2P | Físico a físico. |\n| P2V | Físico a virtual. |\n| V2P | Virtual a físico. |\n| V2V | Virtual a virtual. |\n| SMART | Monitoriza
